<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Photo Card privacy pixel acceptance</title></head>
<body>
<h1>R1-03C pixel-test</h1><output id="result">RUNNING</output>
<script type="module">
import { renderEdits } from '/src/studio/render.ts'
import { emptyEdits } from '/src/studio/versions.ts'
import { stripEncodedMetadata } from '/src/profiles/image.ts'
// Open this route with Chromium against Vite dev; test is browser-only because
// jsdom does not implement actual Canvas/decoding. Never use a user image.
const result = document.getElementById('result')
function assert(value, text) { if (!value) throw new Error(text) }
async function decode(blob) {
  const img = new Image(), url = URL.createObjectURL(blob)
  try { img.src=url; await img.decode(); return img }
  finally { URL.revokeObjectURL(url) }
}
async function test(rotation) {
  const source = document.createElement('canvas')
  source.width=source.height=128
  const ctx=source.getContext('2d')
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,128,128)
  ctx.fillStyle='#ff0000';ctx.fillRect(36,36,56,56)
  const img = await decode(await new Promise(resolve=>source.toBlob(resolve,'image/jpeg',.98)))
  const edits={...emptyEdits(),rotation,watermark:'SYNTHETIC',
    shapes:[{id:'redact-center',kind:'redact',
      from:{x:.35,y:.35},to:{x:.65,y:.65},color:'#000000',width:.02}],
    text:'watermark text',
    strokes:[{id:'stroke',tool:'pencil',points:[{x:.4,y:.4},{x:.6,y:.6}],
      width:.06,color:'#ffffff',opacity:1}],
    texts:[{id:'text',text:'SECRET',x:.48,y:.48,size:.1,color:'#ffffff'}],
  }
  const flattened=renderEdits(img,edits)
  const clean=await stripEncodedMetadata(await new Promise(resolve=>
    flattened.toBlob(resolve,'image/jpeg',.96)))
  assert(clean.type==='image/jpeg','safe photo is not JPEG')
  const encoded = new Uint8Array(await clean.arrayBuffer())
  assert(encoded[0]===255&&encoded[1]===216,'missing JPEG SOI')
  const decoded=await decode(clean)
  const out=document.createElement('canvas');out.width=decoded.naturalWidth;out.height=decoded.naturalHeight
  const pen=out.getContext('2d');pen.drawImage(decoded,0,0)
  const middle=pen.getImageData(Math.floor(out.width/2),Math.floor(out.height/2),1,1).data
  assert(middle[0]<22&&middle[1]<22&&middle[2]<22,
    'redaction missing from saved pixels, RGB '+[...middle])
  assert(clean.size>100,'empty JPEG')
  flattened.width=flattened.height=0;source.width=source.height=0
}
try {
  for (const rotation of [0,1,2,3]) await test(rotation)
  result.textContent='PASS: redaction remains opaque in re-encoded JPEG with rotation, drawing, text and watermark'
  result.dataset.status='pass'
} catch (e) {
  result.textContent='FAIL: '+e.message
  result.dataset.status='fail'
  throw e
}
</script>
</body>
</html>
