services:
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    working_dir: /usr/share/nginx/html
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/static-preview.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:5173/]
      interval: 5s
      timeout: 3s
      retries: 20
