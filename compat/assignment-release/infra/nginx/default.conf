map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 68m;
    # Paths, queries, tokens and network addresses must not enter access logs.
    access_log off;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Cache-Control "no-store" always;
    # Vite's development compiler injects styles/HMR; production has a separate strict CSP.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'" always;

    location = /rtc/admission-gate {
        error_log /dev/null;
        internal;
        proxy_pass http://api:8000/api/v1/rtc-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-RTC-Token $rtc_token;
        proxy_set_header X-Forwarded-For "";
    }
    location /rtc/sfu/ {
        set $rtc_token $arg_access_token;
        auth_request /rtc/admission-gate;
        error_log /dev/null;
        if ($uri !~ "^/rtc/sfu/rtc(?:/|$)") { return 404; }
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $rtc_upstream livekit:7880;
        rewrite ^/rtc/sfu/(.*)$ /$1 break;
        proxy_pass http://$rtc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # Admin/provisioning and independent Matrix login are backend-only.
    location ~ ^/(?:_synapse|_matrix/federation|_matrix/key)/ { return 404; }
    location ~ ^/_matrix/client/(?:v3|r0|v1)/(?:register|login)(?:/|$) { return 403; }
    # SDK uploads use the legacy media prefix; downloads use authenticated client/v1.
    location = /_matrix/media/v3/upload {
        if ($request_method != POST) { return 405; }
        client_max_body_size 20m;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $matrix_upstream matrix:8008;
        proxy_pass http://$matrix_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
    location /_matrix/media/ { return 404; }
    location /_matrix/client/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $matrix_upstream matrix:8008;
        proxy_pass http://$matrix_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cache-Control;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }
}
