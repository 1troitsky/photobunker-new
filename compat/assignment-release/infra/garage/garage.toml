metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
metadata_fsync = true
data_fsync = true
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# GARAGE_RPC_SECRET is supplied through the ignored local environment.

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
