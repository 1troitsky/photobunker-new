server {
    listen 443 ssl;
    listen 8448 ssl;
    server_name matrix.photobunker.test;
    ssl_certificate /etc/rtc/server.crt;
    ssl_certificate_key /etc/rtc/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/stderr crit;
    location = /.well-known/matrix/server { default_type application/json; return 200 '{"m.server":"matrix.photobunker.test:8448"}'; }
    location = /_matrix/federation/v1/openid/userinfo {
        error_log /dev/null;
        proxy_pass http://matrix:8008;
        proxy_set_header Host matrix.photobunker.test;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
    }
    location / { return 404; }
}
