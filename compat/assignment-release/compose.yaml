name: photobunker

x-api: &api
  image: photobunker-php:local
  build:
    context: .
    dockerfile: infra/php/Dockerfile
  working_dir: /app
  env_file: ./apps/api/.env
  volumes:
    - ./apps/api:/app
  networks: [local, matrix-internal]
  depends_on:
    postgres:
      condition: service_healthy
    garage:
      condition: service_healthy
  init: true

services:
  matrix:
    profiles: [matrix]
    image: ghcr.io/matrix-construct/tuwunel:v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec
    environment:
      TUWUNEL_CONFIG: /etc/tuwunel.toml
      TUWUNEL_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SECRET:-}
    volumes:
      - ./infra/matrix/tuwunel.toml:/etc/tuwunel.toml:ro
      - matrix-data:/var/lib/tuwunel
    networks: [matrix-internal]
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photobunker}
      POSTGRES_USER: ${POSTGRES_USER:-photobunker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/dev setup first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [local]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Run ./scripts/dev setup first}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?Run ./scripts/dev setup first}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?Run ./scripts/dev setup first}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-photobunker}
      RUST_LOG: warn
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${S3_PORT:-3900}:3900"
    networks: [local]
    labels:
      dev.orbstack.domains: s3.photobunker.orb.local
      dev.orbstack.http-port: "3900"
    healthcheck:
      test: [CMD, /garage, status]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *api
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/ready') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *api
    command: [php, artisan, queue:work, --sleep=1, --tries=3, --timeout=60]
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *api
    command: [php, artisan, schedule:work]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    working_dir: /app
    command: [npm, run, dev, --, --host, 0.0.0.0]
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/app
    networks: [local]
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [local, matrix-internal]
    labels:
      dev.orbstack.domains: photobunker.orb.local
      dev.orbstack.http-port: "80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  matrix-internal:
    internal: true
  local: {}

volumes:
  matrix-data:
  postgres-data:
  garage-meta:
  garage-data:
