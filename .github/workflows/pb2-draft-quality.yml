name: PB2 Draft quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pb2-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Vue, TS, architecture, unit, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check architecture
        run: pnpm test:architecture
      - name: ESLint
        run: pnpm lint
      - name: Vue and TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build and bundle checks
        run: pnpm build

  php:
    name: Laravel PHP 8.4 and PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, openssl, sqlite3, pdo_sqlite, fileinfo, curl, zip
          coverage: none
      - name: Install locked Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find app tests database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit – isolated testing SQLite
        run: php vendor/bin/phpunit
