.app-main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}.content-inner{padding:23px 15px 35px}.browser-heading{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}.browser-heading-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.browser-heading h1{margin:0;font-size:29px;line-height:1.1;font-weight:800;letter-spacing:-.045em}.browser-heading-copy small{color:#a3a3a3;font-size:11px}.view-switch{flex:0 0 auto;display:flex;gap:3px;border-radius:7px;padding:3px;background:#242424}.view-switch button{display:grid;place-items:center;height:33px;width:35px;padding:0;border:0;border-radius:5px;background:none;color:#aaa}.view-switch button.selected{background:#464646;color:#fff}.view-switch svg{height:18px;width:18px}

.browser-search{margin-bottom:14px}.search-line{display:flex;align-items:center;gap:8px;height:43px;padding:0 11px;border:1px solid #454545;border-radius:6px;background:#292929}.search-line svg{width:18px;height:18px;color:#999}.search-line input{width:100%;min-width:0;height:100%;border:0;outline:none;background:transparent;color:#eee;font-size:13px}.tag-filters{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}.tag-filters button{flex:0 0 auto;padding:5px 8px;border:1px solid #444;border-radius:5px;background:#292929;color:#aaa;font-size:11px}.tag-filters button.selected{border-color:#37784a;color:var(--green)}.selection-bar{display:flex;gap:8px;align-items:center;padding:8px 9px;border-radius:7px;margin-bottom:15px;background:#263128}.selection-bar strong{flex:1;font-size:12px;color:#e0eee3;font-weight:700}.selection-bar button{padding:9px 11px;border:0;border-radius:5px;background:#3a453b;color:#eee;font-size:12px}.selection-bar button:last-child{background:var(--green);color:#142216;font-weight:730}
.browser-items{display:grid;gap:10px}.browser-items.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.browser-entry{position:relative;min-width:0}.browser-entry.selected{outline:2px solid var(--green);outline-offset:-2px;border-radius:8px}.browser-items.grid .browser-entry{overflow:hidden;border:1px solid #343434;border-radius:8px;background:#202020}.entry-open{width:100%;min-width:0;padding:0;border:0;background:transparent;text-align:left}.entry-preview{display:block;width:100%;aspect-ratio:1.35;overflow:hidden;position:relative;background:#303030}.entry-preview svg.scene{display:block;width:100%;height:100%;fill:none;stroke:none}.entry-preview.collage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:3px;padding:3px;background:#282e2b}.entry-preview.collage svg.scene{width:100%;height:100%;min-width:0;min-height:0}.entry-preview .empty-mini{display:block;background:#383e3a;width:100%;height:100%}.entry-preview.empty-folder{display:grid;place-items:center;color:#aaa}.entry-preview.empty-folder > svg{width:38px;height:38px}.entry-folder-badge{position:absolute;top:8px;left:8px;z-index:1;display:flex;align-items:center;gap:5px;background:#131917e8;color:#fff;border-radius:4px;padding:5px 7px;font-size:9px;font-weight:750;letter-spacing:.035em}.entry-folder-badge svg{width:12px;height:12px}.entry-copy{display:flex;flex-direction:column;gap:5px;min-width:0;padding:10px 30px 13px 10px}.entry-copy strong{color:#f2f2f2;font-size:12px;font-weight:710;line-height:1.35;overflow-wrap:anywhere}.entry-copy small{color:#a3a3a3;font-size:10px;line-height:1.35}.entry-copy .expiring{color:#d9b184}.entry-copy .tags{color:#9bc5a4;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.entry-more{position:absolute;right:3px;bottom:6px;display:grid;place-items:center;height:30px;width:29px;padding:0;border:0;background:transparent;color:#bbb;font-size:20px}.entry-check{position:absolute;top:9px;right:9px;z-index:2;width:20px;height:20px;accent-color:var(--green)}.tree-expand{display:none}.browser-empty{grid-column:1/-1;text-align:center;padding:40px 20px;background:#222;border-radius:8px;color:#aaa;font-size:13px}
.browser-items.list,.browser-items.tree{grid-template-columns:minmax(0,1fr);gap:0}.browser-items.list .browser-entry,.browser-items.tree .browser-entry{display:flex;align-items:center;gap:7px;min-height:74px;border-bottom:1px solid #343434}.browser-items.list .entry-open,.browser-items.tree .entry-open{display:flex;flex:1;min-width:0;align-items:center;gap:11px;padding:8px 0}.browser-items.list .entry-preview,.browser-items.tree .entry-preview{width:58px;height:54px;flex:0 0 58px;aspect-ratio:auto;border-radius:6px}.browser-items.list .entry-copy,.browser-items.tree .entry-copy{min-width:0;flex:1;padding:2px 0}.browser-items.list .entry-copy strong,.browser-items.tree .entry-copy strong{font-size:14px}.browser-items.list .entry-folder-badge,.browser-items.tree .entry-folder-badge{display:none}.browser-items.list .entry-more,.browser-items.tree .entry-more{position:static;flex:0 0 31px}.browser-items.list .entry-check,.browser-items.tree .entry-check{position:static;flex:0 0 20px;margin:0 1px}.browser-items.tree .entry-preview{height:43px;width:43px;flex-basis:43px}.browser-items.tree .browser-entry{margin-left:calc(min(var(--depth,0),4)*15px)}.browser-items.tree .tree-expand{display:block;height:31px;width:21px;flex:0 0 21px;border:0;background:none;color:#aaa;font-size:21px}.browser-items.tree .tree-expand:disabled{opacity:0}
.entry-preview .imported-thumb{display:block;width:100%;height:100%;object-fit:cover}.file-mark{display:grid;place-items:center;width:100%;height:100%;background:#29363b;color:#a9ceda}.file-mark.audio{background:#30313b;color:#b9c5e3}.file-mark svg{height:38%;width:38%;fill:none;stroke:currentColor;stroke-width:1.5}.entry-preview.collage .file-mark svg{width:46%;height:46%}
.app-dock{flex:0 0 82px;height:82px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#181818;border-top:1px solid #303030;padding:9px 2px 14px}.app-dock button{border:0;background:transparent;color:#999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;font-size:11px}.app-dock button svg{width:21px;height:21px}.app-dock small{font-size:10px;white-space:nowrap}.app-dock button.selected{color:var(--green)}
.dialog-overlay{position:absolute;z-index:40;inset:0;display:flex;align-items:flex-end;background:#000b}.dialog-sheet{width:100%;max-height:86%;overflow:auto;padding:18px 17px 24px;background:#292929;border-radius:12px 12px 0 0}.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.dialog-heading strong{font-size:15px;font-weight:750}.dialog-heading button{padding:6px;border:0;background:transparent;color:#ddd}.dialog-content{display:grid;gap:10px}.dialog-content > button{padding:12px;border:0;border-radius:6px;background:#393939;color:#eee;text-align:left}.dialog-content > button.primary-action{background:var(--green);color:#152119;text-align:center;font-weight:750}.dialog-content > button.danger{color:#efaaaa}.dialog-content label{display:grid;gap:5px;color:#bbb;font-size:12px}.dialog-content input,.dialog-content select,.dialog-content textarea{width:100%;background:#1c1c1c;color:#fff;border:1px solid #555;border-radius:6px;padding:10px;font-size:13px}.dialog-content input[type=checkbox]{width:auto}.dialog-content .info{padding:13px;background:#383838;border-radius:7px;color:#d1d1d1;font-size:12px;line-height:1.6}.dialog-content .photo-large{overflow:hidden;width:100%;aspect-ratio:1.55;background:#393939;border-radius:7px}.dialog-content .photo-large > svg,.dialog-content .photo-large > img{width:100%;height:100%;object-fit:contain}.dialog-content .settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #414141}.settings-row span{display:grid;gap:3px}.settings-row small{color:#a5a5a5}.dialog-content .setting-toggle{appearance:none;height:23px;width:40px;flex:0 0 40px;border:0;border-radius:16px;background:#555;position:relative;cursor:pointer;margin:0}.dialog-content .setting-toggle:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;background:#eee;border-radius:50%;transition:transform .16s}.dialog-content .setting-toggle:checked{background:var(--green)}.dialog-content .setting-toggle:checked:after{transform:translateX(17px);background:#162418}
/* Upload only — existing catalogue remains unchanged */
.upload-dropzone{position:relative;display:grid;place-items:center;gap:6px;text-align:center;min-height:123px;padding:18px 10px;border:1px dashed #617565;border-radius:7px;background:#29332d;color:#ebf5ed;cursor:pointer}.upload-dropzone svg{height:27px;width:27px;color:var(--green)}.upload-dropzone strong{font-size:13px}.upload-dropzone small{font-size:11px;color:#aac5af}.upload-dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload-dropzone.dragging{border-color:var(--green);background:#2a4234}.upload-divider{text-align:center;color:#969696;font-size:11px}.upload-feedback{min-height:0;color:#bce2c1;font-size:11px;line-height:1.5}.upload-feedback.error{color:#efa7a7}.upload-note{display:grid;gap:4px;font-size:11px;line-height:1.55;color:#aaa}.upload-current{display:flex;gap:6px;align-items:center;font-size:11px;color:#aaa}.upload-current strong{color:#eee;font-weight:630}.url-row{display:grid;gap:7px}
.device.desktop .content-inner{padding:30px}.device.desktop .browser-items.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.device.desktop .dialog-sheet{max-width:480px;margin:0 auto}
@media(max-width:460px){.app-header{padding-inline:9px;gap:5px}.brand-mark{height:34px;width:34px;flex-basis:34px}.header-actions button{width:28px;flex-basis:28px}.content-inner{padding:22px 12px 29px}.browser-sections button{font-size:11px}}
@media(max-width:365px){.header-actions button{width:25px;flex-basis:25px}.app-header{gap:4px}.brand-state strong{font-size:12px}.brand-mark{height:31px;width:31px;flex-basis:31px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Corrections from owner-supplied screenshots: list/tree density and folder symbols. */
.browser-items.list .entry-folder-badge,
.browser-items.tree .entry-folder-badge {
 display:grid;place-items:center;position:absolute;top:3px;right:3px;left:auto;
 min-width:21px;height:20px;padding:3px;border-radius:4px;
 background:#151a19d9;color:#dce4e0;z-index:3;
}
.browser-items.list .entry-folder-badge svg,
.browser-items.tree .entry-folder-badge svg {width:14px;height:14px;}
.entry-folder-badge {font-size:0;letter-spacing:0;min-width:24px;height:24px;padding:4px;gap:0;}
.entry-folder-badge svg {width:16px;height:16px;}
.entry-preview {position:relative;}
.file-mark {background:#272e31;color:#d7e0e6;}
.file-mark.audio {background:#292b35;color:#d9c6ec;}
.file-mark svg {width:40%;height:40%;stroke-width:1.7;}
.browser-items.list .file-mark svg,.browser-items.tree .file-mark svg {width:28px;height:28px;}
/* Screenshot: title/sections, breadcrumb and rows align to 20px inner gutter. */
.content-inner{padding:24px 20px 35px}
.device.desktop .content-inner{padding:30px 20px}
.browser-items.list .entry-open,.browser-items.tree .entry-open{position:relative}
/* Keep original subtle row separators rather than boxed cards. */
.browser-items.list .browser-entry,.browser-items.tree .browser-entry {border-bottom:1px solid #343434}
/* The only addition to old header: upload button next to new folder. */
.header-actions{gap:0}
.header-actions button{width:32px;height:40px;flex:0 0 32px;border:0;background:transparent}
.header-actions button svg{width:20px;height:20px}
.header-actions button:hover{background:#292929}
@media(max-width:460px){.content-inner{padding:22px 13px 29px}.header-actions button{width:29px;flex-basis:29px}}
@media(max-width:360px){.header-actions button{width:27px;flex-basis:27px}}

/* File type filters and explicit folder scope for search */
.search-controls{display:grid;gap:10px;padding-top:10px}
.search-scope-label,.upload-destination{display:grid;gap:6px;color:#bbb;font-size:11px;font-weight:600}
.search-scope-label select,.upload-destination select{min-width:0;width:100%;height:41px;border:1px solid #464646;border-radius:6px;background:#282828;color:#eee;padding:0 10px;font-size:12px}
.type-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.type-filters button{min-width:0;min-height:35px;border:1px solid #444;border-radius:6px;background:#292929;color:#aaa;padding:5px 2px;font-size:10px;white-space:nowrap}
.type-filters button.selected{background:#264a32;color:#d9ffe0;border-color:#31834b}
.entry-location{color:#799b88!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-more{z-index:3;display:grid!important;place-items:center;min-width:32px;min-height:32px;opacity:1!important;color:#d0d0d0;letter-spacing:1px;line-height:1}
.entry-more:hover,.entry-more:focus-visible{color:#fff;background:#373737;border-radius:5px}
.browser-items.grid .entry-more{right:3px;bottom:7px}
.browser-items.list .entry-more,.browser-items.tree .entry-more{position:relative;flex:0 0 34px;margin-left:auto}
.upload-destination select:focus-visible{outline:2px solid #1ed760}



/* Additional settings and batch editing use the existing bottom sheet. */
.dialog-content .bulk-summary{padding:9px 11px;background:#263628;color:#d9f2df;border-radius:6px;font-size:12px}
.dialog-content input:disabled,.dialog-content select:disabled{opacity:.45;cursor:default}
.entry-copy .entry-category{color:#a8b9aa;font-size:10px}
.browser-sections button[hidden]{display:none}


.browser-sections:has([data-section="archive"][hidden]){grid-template-columns:repeat(3,minmax(0,1fr))}
</style>
</head>
<body>
<div class="preview-bar"><span class="preview-label"><i></i> BROWSER / КАТАЛОГ <small>· макет</small></span><div class="preview-modes"><button type="button" data-device="phone" class="selected" aria-pressed="true">Телефон</button><button type="button" data-device="desktop" aria-pressed="false">Desktop</button></div></div>
<div class="preview-stage"><div class="device phone" id="device"><div class="app" id="app">
<header class="app-header">
 <span class="brand-mark" aria-hidden="true">pb</span>

 <div class="header-actions">
  <button type="button" data-action="create" title="Новая папка" aria-label="Новая папка"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>
  <button type="button" data-action="upload" title="Загрузить файлы" aria-label="Загрузить файлы"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></svg></button>
  <button type="button" data-action="select" title="Выбрать элементы" aria-label="Выбрать элементы"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg></button>

  <button type="button" data-action="search" title="Поиск" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></button>
  <button type="button" data-action="settings" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg></button>
 </div>
</header>
<main class="app-main" id="browser-content"><div class="content-inner">
 <div class="browser-heading"><div class="browser-heading-copy"><h1>Browser</h1><small id="browser-count"></small></div><div class="view-switch" aria-label="Режим просмотра">
 <button type="button" data-view="grid" aria-label="Сетка" title="Сетка" class="selected" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
 <button type="button" class="selected" data-view="list" aria-label="Список" title="Список" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h2M3 12h2M3 18h2"/></svg></button>
 <button type="button" data-view="tree" aria-label="Дерево" title="Дерево" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4v16M4 8h5m-5 8h5M11 8h10M11 16h10"/></svg></button>
 </div></div>
 <nav class="browser-sections" role="tablist" aria-label="Разделы Browser"><button type="button" data-section="all" role="tab" aria-selected="false">Все</button><button type="button" data-section="personal" class="selected" role="tab" aria-selected="true">Мои фото</button><button type="button" data-section="assignments" role="tab" aria-selected="false">Задания</button><button type="button" data-section="archive" role="tab" aria-selected="false">Архив</button></nav>
 <nav class="browser-path" aria-label="Текущая папка"><button type="button" class="path-back" data-action="back" aria-label="На уровень выше"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M8 12h12"/></svg></button><div class="path-breadcrumbs"></div></nav>
 <div class="browser-search" hidden><label class="search-line"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input type="search" id="browser-query" aria-label="Поиск файлов и папок" placeholder="Название или ID файла" autocomplete="off"></label><div class="search-controls">
  <label class="search-scope-label">Искать в папке
    <select id="search-folder" aria-label="Область поиска"></select>
  </label>
  <div class="type-filters" role="group" aria-label="Типы файлов">
    <button type="button" data-type="all" class="selected" aria-pressed="true">Все файлы</button>
    <button type="button" data-type="photo" aria-pressed="false">Фото</button>
    <button type="button" data-type="video" aria-pressed="false">Видео</button>
    <button type="button" data-type="audio" aria-pressed="false">Аудио</button>

}
function feedback(text,error=false){const el=$('#upload-feedback');if(el){el.textContent=text;el.className='upload-feedback'+(error?' error':'')}}
function addFiles(files){let success=0,skip=0;for(const file of files){const kind=typeFor(file);if(!kind||file.size===0||file.size>MAX_FILE){skip++;continue}entries.push({id:'import-'+(++nextId),parent:state.destination,kind,name:file.name,file,created:'Сегодня',order:Date.now()+nextId/1000,modifiedAt:Date.now(),size:file.size,url:URL.createObjectURL(file),imported:true,daysToExpiry:null,tags:[],category:'',deletable:true});success++}if(!success){feedback('Не удалось добавить файлы. Проверьте формат и размер.',true);return}const destination=state.destination;close();navigate(destination);if(skip)msg('Файлы добавлены','Добавлено: '+success+'. Пропущено: '+skip+'.')}
async function fetchURL(){if(state.urlAbort)return;const input=$('#upload-url');let url;try{url=new URL(input.value.trim());if(url.protocol!=='https:')throw Error('Only HTTPS')}catch{feedback('Укажите прямую HTTPS-ссылку на файл.',true);return}const controller=new AbortController();state.urlAbort=controller;const btn=$('[data-action="fetch-url"]');btn.disabled=true;feedback('Загрузка…');try{const res=await fetch(url.toString(),{mode:'cors',credentials:'omit',signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);const mime=(res.headers.get('content-type')||'').split(';')[0].toLowerCase();if(mime.includes('text/html'))throw Error('HTML, not file');if(Number(res.headers.get('content-length')||0)>MAX_FILE)throw Error('Too large');let chunks=[],size=0;if(res.body?.getReader){const reader=res.body.getReader();while(true){const{done,value}=await reader.read();if(done)break;size+=value.byteLength;if(size>MAX_FILE){await reader.cancel();throw Error('Too large')}chunks.push(value)}}else{const blob=await res.blob();if(blob.size>MAX_FILE)throw Error('Too large');chunks=[blob]}let name=url.pathname.split('/').pop()||'file';try{name=decodeURIComponent(name)}catch{}name=name.replace(/[\\/]/g,'_').slice(0,120);const file=new File(chunks,name,{type:mime});if(!typeFor(file))throw Error('Unknown format');if(!controller.signal.aborted&&state.dialog==='upload')addFiles([file])}catch(e){if(!controller.signal.aborted)feedback('Не удалось загрузить файл. Проверьте ссылку и доступ к ней.',true)}finally{if(state.urlAbort===controller)state.urlAbort=null;if(btn.isConnected)btn.disabled=false}}
function showPhoto(e){const image=e.url?'<img src="'+escapeHTML(e.url)+'" alt="">':scene(e.sceneIndex);dialog(e.name,'<div class="photo-large">'+image+'</div><div class="info">'+(e.imported?mediaName(e)+' · '+formatBytes(e.size):'Снято: '+e.created+' · '+expiry(e))+'</div>','preview',e.id)}
function parseTags(text){return [...new Set(text.split(',').map(x=>x.trim()).filter(Boolean))]}
function selectedMedia(){return [...state.selected].map(get).filter(isMedia)}
function categoryListHTML(){const values=[...new Set(entries.filter(isMedia).map(e=>e.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));return '<datalist id="known-categories">'+values.map(x=>'<option value="'+escapeHTML(x)+'"></option>').join('')+'</datalist>'}
function handle(action,id){
  const item=get(id);
  if(action==='close'){close();return}
  if(action==='back'){
    let chain=lineage(state.location);
    navigate(chain.length>1?chain[chain.length-2].id:'all');return
  }
  if(action==='navigate'){navigate(id);return}
  if(action==='upload'){importOpen();return}
  if(action==='fetch-url'){void fetchURL();return}
  if(action==='create'){
    const options=folderOptions({uploadOnly:true});
    dialog('Новая папка','<label>Название<input id="folder-name" maxlength="80" placeholder="Новая папка"></label>'+ 
      '<label>Расположение<select id="folder-parent">'+options+'</select></label>'+button('create-folder','Создать папку','primary-action'));
    $('#folder-parent').value=canWriteTo(state.location)?state.location:'all';return
  }
  if(action==='create-folder'){
    const name=$('#folder-name').value.trim(),parent=$('#folder-parent').value;
    if(!name||!canWriteTo(parent)||kids(parent).some(e=>e.kind==='folder'&&e.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return;
    entries.push({id:'folder-'+(++nextId),name,kind:'folder',parent,order:Date.now(),modifiedAt:Date.now(),created:'Сегодня'});
    close();navigate(parent);return
  }
  if(action==='search'){
    state.searchOpen=!state.searchOpen;
    state.searchFolder='current';state.typeFilter='all';
    if(!state.searchOpen){state.query='';$('#browser-query').value=''}
    render();if(state.searchOpen)$('#browser-query').focus();return
  }
  if(action==='select'||action==='cancel'){
    state.selectMode=action==='select'?!state.selectMode:false;
    state.selected.clear();render();return
  }
  if(action==='expand'){
    state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render();return
  }
  if(action==='open'){
    if(state.selectMode&&canSelect(item)){
      state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render();return
    }
    if(!item)return;
    if(isMedia(item)){
      if(item.kind==='photo')showPhoto(item);
      else dialog(item.name,'<div class="info">'+mediaName(item)+(item.duration?' · '+escapeHTML(item.duration):'')+(item.size?' · '+formatBytes(item.size):'')+'</div>','item',id)
    } else navigate(id);
    return
  }
  if(action==='menu'){
    if(!item)return;
    const file=isMedia(item),system=isSystem(item);
    let actions=button('open-menu',file?'Открыть файл':'Открыть папку')+
      button('share-item','Поделиться');
    if(!system){
      actions+=button('rename',file?'Переименовать':'Переименовать папку');
      if(file)actions+=button('tags','Изменить теги')+button('category','Изменить категорию');
      if(state.useArchive && (file||item.kind==='folder') && sectionOf(item.id)!=='archive')actions+=button('archive','В архив');
      if(state.useArchive && sectionOf(item.id)==='archive')actions+=button('archive','Восстановить из архива');
      actions+=button('move','Переместить')+button('delete','Удалить','danger');
    }
    dialog(item.name,actions,'menu',item.id);return
  }
  if(action==='open-menu'){
    const cur=get(state.target),which=cur?.id;
    close();if(which)handle('open',which);return
  }
  if(action==='share'||action==='share-item'){
    const cur=action==='share-item'?get(state.target):null;
    dialog('Поделиться',
      (cur?'<div class="info">'+escapeHTML(cur.name)+'</div>':'')+
      '<label>Способ отправки<select id="share-method"><option value="link">По ссылке</option><option value="contact">Контакту</option></select></label>'+
      '<label>Разрешения<select id="share-permission"><option value="view">Только просмотр</option><option value="download">Просмотр и скачивание</option></select></label>'+
      (cur?.file&&typeof navigator.share==='function'?button('share-native','Отправить файл с устройства'): '')+
      button('share-apply','Сохранить параметры','primary-action'),
      'share',cur?.id||'');return
  }
  if(action==='share-apply'){
    const cur=get(state.target);
    if(cur)cur.sharePrefs={method:$('#share-method').value,permission:$('#share-permission').value};
    close();return
  }
  if(action==='share-native'){
    const cur=get(state.target);
    if(cur?.file&&navigator.share){
      navigator.share({files:[cur.file],title:cur.name}).catch(()=>{});
      close();
    }
    return
  }
  if(action==='rename'){
    const cur=get(state.target);if(!cur||isSystem(cur))return;
    dialog('Переименовать','<label>Название<input id="rename-name" maxlength="120" value="'+escapeHTML(cur.name)+'"></label>'+button('save-rename','Сохранить','primary-action'),'rename',cur.id);return
  }
  if(action==='save-rename'){
    const cur=get(state.target),name=$('#rename-name').value.trim();
    if(cur&&!isSystem(cur)&&name){cur.name=name;markModified(cur);close();render()}return
  }
  if(action==='tags'){
    const cur=get(state.target);if(!isMedia(cur))return;
    dialog('Теги файла','<label>Теги через запятую<input id="tags-input" value="'+escapeHTML((cur.tags||[]).join(', '))+'"></label>'+button('save-tags','Сохранить','primary-action'),'tags',cur.id);return
  }
  if(action==='save-tags'){
    const cur=get(state.target);if(!isMedia(cur))return;
    cur.tags=$('#tags-input').value.split(',').map(s=>s.trim()).filter(Boolean);markModified(cur);
    close();render();return
  }
  if(action==='category'){
    const cur=get(state.target);if(!isMedia(cur))return;
    dialog('Категория файла','<label>Категория<input id="category-single" maxlength="80" value="'+escapeHTML(cur.category||'')+'" list="known-categories"></label>'+categoryListHTML()+button('save-category','Сохранить','primary-action'),'category',cur.id);return
  }
  if(action==='save-category'){
    const cur=get(state.target);if(!isMedia(cur))return;
    cur.category=$('#category-single').value.trim().slice(0,80);markModified(cur);close();render();return
  }
  if(action==='archive'){
    if(!state.useArchive)return;
    const cur=get(state.target);if(!cur||isSystem(cur))return;
    if(sectionOf(cur.id)==='archive'){
      cur.parent=canWriteTo(cur.previousParent)?cur.previousParent:'personal';delete cur.previousParent;delete cur.archivedAt;markModified(cur)
    }else archiveSelected([cur.id]);
    close();render();return
  }
  if(action==='move'){
    const cur=get(state.target);if(!cur||isSystem(cur))return;
    const available=entries.filter(e=>canUploadTo(e) && e.id!==cur.id &&
      !lineage(e.id).some(p=>p.id===cur.id) &&
      sectionOf(e.id)===sectionOf(cur.id));
    dialog('Переместить','<label>Папка назначения<select id="move-destination">'+
      available.map(e=>'<option value="'+escapeHTML(e.id)+'">'+escapeHTML(pathLabel(e.id))+'</option>').join('')+
      '</select></label>'+button('move-confirm','Переместить','primary-action'),'move',cur.id);return
  }
  if(action==='move-confirm'){
    const cur=get(state.target),dest=$('#move-destination').value;
    if(cur&&!isSystem(cur)&&canWriteTo(dest) && sectionOf(cur.id)===sectionOf(dest) &&
      cur.id!==dest && !lineage(dest).some(e=>e.id===cur.id)){
      cur.parent=dest;markModified(cur);close();navigate(dest)
    }return
  }
  if(action==='delete'){
    const cur=get(state.target);if(!cur||isSystem(cur))return;
    const removeForever=!state.useArchive||sectionOf(cur.id)==='archive';
    dialog(removeForever?'Удалить':'Переместить в архив','<div class="info">'+(removeForever?'Удалить «':'Переместить в архив «')+escapeHTML(cur.name)+'»?</div>'+button('delete-confirm',removeForever?'Удалить':'В архив',removeForever?'danger':'primary-action'),'delete',cur.id);return
  }
  if(action==='delete-confirm'){
    const cur=get(state.target);if(!cur||isSystem(cur))return;
    deleteOrArchive([cur.id]);
    close();render();return
  }
  if(action==='settings'){
    dialog('Настройки Browser','<label>Открывать первым<select id="first-section"><option value="all">Все</option><option value="personal">Мои фото</option><option value="assignments">Задания</option><option value="archive">Архив</option></select></label>'+ 
      '<label>Сортировка<select id="sort"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option><option value="name">По названию</option><option value="deleteSoon">По дате удаления — ближайшие</option><option value="modified">По дате изменения — новые</option></select></label>'+ 
      '<label class="settings-row"><span><strong>Папки всегда сверху</strong><small>Независимо от сортировки</small></span><input type="checkbox" id="folder-first" class="setting-toggle"></label>'+ 
      '<label class="settings-row"><span><strong>Показывать оставшиеся дни</strong><small>Вместо даты удаления</small></span><input type="checkbox" id="days-left" class="setting-toggle"></label>'+
      '<label class="settings-row"><span><strong>Использовать архив</strong><small>При выключении файлы удаляются сразу</small></span><input type="checkbox" id="archive-enabled" class="setting-toggle"></label>'+
      '<label class="settings-row"><span><strong>Автоудаление из архива через 7 дней</strong><small>После перемещения в архив</small></span><input type="checkbox" id="archive-auto" class="setting-toggle"></label>'+
      button('save-settings','Применить','primary-action'),'settings');
    $('#first-section').value=state.openFirst;$('#sort').value=state.sort;
    $('#folder-first').checked=state.foldersFirst;$('#days-left').checked=state.daysLeft;$('#archive-enabled').checked=state.useArchive;$('#archive-auto').checked=state.archiveAutoDelete;$('#archive-auto').disabled=!state.useArchive;return
  }
  if(action==='save-settings'){
    state.openFirst=$('#first-section').value;state.sort=$('#sort').value;
    state.foldersFirst=$('#folder-first').checked;state.daysLeft=$('#days-left').checked;
    state.useArchive=$('#archive-enabled').checked;state.archiveAutoDelete=$('#archive-auto').checked;
    if(!state.useArchive&&sectionOf(state.location)==='archive')state.location='personal';
    if(!state.useArchive&&state.openFirst==='archive')state.openFirst='personal';
    close();render();return
  }
  if(action==='bulk'){
    const selected=[...state.selected].map(get).filter(Boolean);
    const files=selected.filter(isMedia);
    let html=button('select-all','Выбрать всё');
    if(files.length){
      html+='<div class="bulk-summary">'+files.length+' '+noun(files.length,'файл','файла','файлов')+' выбрано</div>'+
        button('bulk-tags','Изменить теги')+button('bulk-category','Изменить категорию');
    }
    if(selected.length)html+=button('share-selected','Поделиться')+button('move-selected','Переместить')+
      button('delete-selected',state.useArchive?'В архив / удалить':'Удалить выбранное',state.useArchive?'':'danger');
    dialog('Действия',html,'bulk');return
  }
  if(action==='bulk-tags'){
    const files=selectedMedia();if(!files.length)return;
    dialog('Теги для '+files.length+' '+noun(files.length,'файла','файлов','файлов'),
      '<label>Действие<select id="bulk-tags-mode"><option value="add">Добавить теги</option><option value="replace">Заменить все теги</option><option value="remove">Удалить указанные теги</option></select></label>'+
      '<label>Теги через запятую<input id="bulk-tags-input" placeholder="например: архитектура, фасад"></label>'+
      button('apply-bulk-tags','Применить','primary-action'),'bulk-tags');return
  }
  if(action==='apply-bulk-tags'){
    const tags=parseTags($('#bulk-tags-input').value);const mode=$('#bulk-tags-mode').value;
    if(!tags.length){$('#bulk-tags-input').focus();return}
    for(const file of selectedMedia()){
      const existing=file.tags||[];
      file.tags=mode==='replace'?tags.slice():mode==='remove'?existing.filter(x=>!tags.some(t=>t.toLocaleLowerCase()===x.toLocaleLowerCase())):
        [...existing,...tags.filter(x=>!existing.some(t=>t.toLocaleLowerCase()===x.toLocaleLowerCase()))];
      markModified(file);
    }
    state.selectMode=false;state.selected.clear();close();render();return
  }
  if(action==='bulk-category'){
    const files=selectedMedia();if(!files.length)return;
    dialog('Категория для '+files.length+' '+noun(files.length,'файла','файлов','файлов'),
      '<label>Категория<input id="bulk-category-input" maxlength="80" placeholder="Введите или выберите категорию" list="known-categories"></label>'+
      categoryListHTML()+button('apply-bulk-category','Применить','primary-action'),'bulk-category');return
  }
  if(action==='apply-bulk-category'){
    const category=$('#bulk-category-input').value.trim();if(!category){$('#bulk-category-input').focus();return}
    for(const file of selectedMedia()){file.category=category;markModified(file)}
    state.selectMode=false;state.selected.clear();close();render();return
  }
  if(action==='select-all'){
    visibleRows().filter(r=>canSelect(r.entry)).forEach(r=>state.selected.add(r.entry.id));
    close();render();return
  }
  if(action==='share-selected'){
    close();handle('share');return
  }
  if(action==='move-selected'){
    dialog('Переместить','<label>Папка назначения<select id="bulk-move">'+folderOptions({uploadOnly:true})+
      '</select></label>'+button('confirm-bulk-move','Переместить','primary-action'),'bulk-move');return
  }
  if(action==='confirm-bulk-move'){
    const dest=$('#bulk-move').value;
    for(const id of state.selected){const cur=get(id);if(cur&&!isSystem(cur)&&canWriteTo(dest)&&sectionOf(cur.id)===sectionOf(dest)&&
      id!==dest&&!lineage(dest).some(e=>e.id===id)){cur.parent=dest;markModified(cur)}}
    state.selected.clear();state.selectMode=false;close();render();return
  }
  if(action==='delete-selected'){
    deleteOrArchive([...state.selected]);
    state.selected.clear();state.selectMode=false;close();render();return
  }
  if(action==='status'){
    dialog('Состояние приложения','<div class="info">В работе</div>'+button('close','Закрыть'),'status');return
  }
  if(action==='nav'){msg(id,'Раздел доступен через общую навигацию.');return}
}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.section){navigate(b.dataset.section);return}if(b.dataset.view){state.view=b.dataset.view;render();return}if(b.dataset.type){state.typeFilter=b.dataset.type;render();return}if(b.dataset.nav){if(b.dataset.nav!=='Browser')handle('nav',b.dataset.nav);return}if(b.dataset.action)handle(b.dataset.action,b.dataset.id||b.dataset.tag||'')});
$$('[data-device]').forEach(b=>b.addEventListener('click',()=>{$('#device').className='device '+b.dataset.device;$$('[data-device]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})}));
$('#app').addEventListener('change',e=>{const el=e.target;if(el.id==='upload-files'){const files=[...el.files];addFiles(files);el.value='';return}if(el.id==='upload-destination'){state.destination=el.value;return}if(el.id==='archive-enabled'){const auto=$('#archive-auto');if(auto)auto.disabled=!el.checked;return}if(el.id==='search-folder'){state.searchFolder=el.value;render();return}if(el.dataset.check){el.checked?state.selected.add(el.dataset.check):state.selected.delete(el.dataset.check);render()}});
$('#dialog-content').addEventListener('dragover',e=>{const zone=e.target.closest('#upload-zone');if(zone){e.preventDefault();zone.classList.add('dragging')}});$('#dialog-content').addEventListener('dragleave',e=>{const zone=e.target.closest('#upload-zone');if(zone)zone.classList.remove('dragging')});$('#dialog-content').addEventListener('drop',e=>{const zone=e.target.closest('#upload-zone');if(zone){e.preventDefault();zone.classList.remove('dragging');addFiles([...e.dataTransfer.files])}});
$('#browser-query').addEventListener('input',e=>{state.query=e.target.value;render()});$('#dialog-overlay').addEventListener('click',e=>{if(e.target.id==='dialog-overlay')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog-overlay').hidden){close()}});window.addEventListener('pagehide',()=>entries.forEach(e=>{if(e.url)URL.revokeObjectURL(e.url)}));
render();
// Demo data only: sweep the visible, in-memory archive while this page is open.
setInterval(()=>{if(cleanupArchive())render()},60000);
})();
</script>
</body></html>
