<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>File Viewer — PhotoBunker / Fieldwork</title><link rel="stylesheet" href="./style.css"></head>
<body>
<div class="preview-bar"><span class="preview-label">FIELDWORK / FILE VIEWER <small>· просмотр файлов</small></span><div class="preview-modes" aria-label="Размер экрана"><button data-device="phone" class="selected" aria-pressed="true">Телефон</button><button data-device="desktop" aria-pressed="false">Desktop</button></div></div>
<div class="preview-stage"><div id="device" class="device phone"><div class="app" id="app">
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h1"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M8 12h12"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 3-4 5 5"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-.5 4.5L8 20l11-11-4-4L4 16zM13 7l4 4"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M16 5v14"/></symbol>
<symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 10l12-2"/><ellipse cx="6" cy="19" rx="3" ry="2"/><ellipse cx="18" cy="17" rx="3" ry="2"/></symbol>
<symbol id="i-max" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></symbol>
</defs></svg>
<header class="app-header"><span class="brand-mark" aria-hidden="true">pb</span><button type="button" class="brand-state" data-action="status"><strong>PhotoBunker</strong><small><i class="state-led"></i><span id="status-label">В работе</span></small></button><div class="header-actions"><button data-action="favorite" aria-label="В избранное" title="В избранное"><svg><use href="#i-star"/></svg></button><button data-action="copy" aria-label="Копировать сжатую копию" title="Копировать сжатую копию"><svg><use href="#i-copy"/></svg></button><button data-action="download" aria-label="Скачать файл" title="Скачать файл"><svg><use href="#i-down"/></svg></button><button data-action="delete" aria-label="Удалить файл" title="Удалить"><svg><use href="#i-trash"/></svg></button></div></header>
<div id="download-pop" class="download-pop" hidden><strong>Скачать файл?</strong><p id="download-question">Скачать копию этого файла на устройство?</p><div class="download-buttons"><button data-action="cancel-download">Отмена</button><button data-action="confirm-download">Скачать</button></div></div>
<main class="viewer" id="viewer">
<nav class="browser-path" aria-label="Путь в каталоге"><button class="path-back" data-action="back" aria-label="Назад в Browser"><svg><use href="#i-back"/></svg></button><div class="path-breadcrumbs"><button data-action="path" data-location="Все">Все</button><span>›</span><button data-action="path" data-location="Задания">Задания</button><span>›</span><button data-action="path" data-location="Фасады — Site A">Фасады — Site A</button><span>›</span><button data-action="path" data-location="Детали фасада" class="current">Детали фасада</button></div></nav>
<div class="image-stage" id="image-stage"><div class="media-content" id="media-content"></div></div>
<section class="photo-summary" id="file-summary" aria-label="Сведения о файле"><div class="name-row"><strong class="photo-name" id="file-name"></strong><small class="photo-id" id="file-id"></small></div><p class="photo-description" id="file-description"></p><div class="date-row"><div><small>Создано</small><span id="file-created"></span></div><div><small>Удаление</small><span id="file-expiration"></span></div></div></section>
<div class="action-tiles"><button data-action="info"><svg><use href="#i-info"/></svg><span>Информация</span></button><button data-action="public"><svg><use href="#i-card"/></svg><span>Публичная карточка</span></button><button data-action="edit"><svg><use href="#i-edit"/></svg><span>Редактировать</span></button></div>
<div class="pager"><button data-action="previous" aria-label="Предыдущий файл"><svg><use href="#i-left"/></svg></button><span class="page-count" id="page-count"></span><button data-action="next" aria-label="Следующий файл"><svg><use href="#i-right"/></svg></button></div>
</main>
<nav class="app-dock" aria-label="Главная навигация"><button data-nav="Задания"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9h8M8 14h8"/></svg><small>Задания</small></button><button data-nav="Browser" class="selected" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h8v13H3z"/></svg><small>Browser</small></button><button data-nav="Камера"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="14" r="4"/></svg><small>Камера</small></button><button data-nav="Контакты"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 6a3 3 0 0 1 0 6m1 5a5 5 0 0 1 3 4"/></svg><small>Контакты</small></button><button data-nav="Профиль"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><small>Профиль</small></button></nav>
<div class="viewer-sheet-layer" id="sheet-layer" hidden><div class="viewer-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="sheet-handle"></div><div class="sheet-heading"><strong id="sheet-title"></strong><button data-action="close-sheet" aria-label="Закрыть">✕</button></div><div class="sheet-content" id="sheet-content"></div></div></div>
<div class="web-layer" id="web-layer" hidden><div class="in-app-browser" role="dialog" aria-modal="true"><div class="web-toolbar"><button data-action="close-web">Готово</button><strong>PUBLIC CARD</strong><button data-action="close-web">✕</button></div><div class="web-page"><div class="web-site-head"><strong>photobunker</strong><span>FILE CARD</span></div><div class="web-image" id="web-media"></div><div class="web-article"><h2 id="web-title"></h2><small id="web-id"></small><p id="web-description"></p></div></div><div class="web-bottom"><button disabled>‹</button><button disabled>›</button><small>In-App Browser</small><button data-action="close-web">✕</button></div></div></div>
<div class="fullscreen-layer" id="fullscreen-layer" hidden tabindex="-1" role="dialog" aria-modal="true"><button class="fullscreen-close" data-action="close-fullscreen" aria-label="Закрыть полный экран">✕</button><div class="fullscreen-media" id="fullscreen-media"><div class="full-content" id="full-content"></div></div><div class="fullscreen-pager"><button data-action="previous">‹</button><span id="fullscreen-count"></span><button data-action="next">›</button></div></div>
</div></div></div>
<script src="./app.js" defer></script>
</body></html>
