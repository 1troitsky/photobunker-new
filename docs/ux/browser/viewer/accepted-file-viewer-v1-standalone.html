function svgPhoto(f){return f.img?`<img src="${escapeHTML(f.img)}" alt="" style="max-width:100%;max-height:100%;object-fit:contain">`:svgArt[f.art||'facade']}
function audioGraphic(f,full=false){let bars='';for(let i=0;i<62;i++){const h=6+Math.round(Math.abs(Math.sin(i*.94)*Math.cos(i*.23))*48);bars+=`<i style="height:${h}px"></i>`}const stamp=full?'full':'main';return `<div class="audio-shell"><div class="audio-icon">${use('music')}</div><div class="audio-wave" id="wave-${stamp}">${bars}</div><div class="audio-control"><button data-action="toggle-audio" data-scope="${stamp}" aria-label="Воспроизвести">${use('play')}</button><input type="range" class="audio-progress" min="0" max="${f.duration}" step="0.01" value="0" aria-label="Позиция аудио"><small class="audio-time">00:00 / ${ftime(f.duration)}</small></div><audio preload="metadata" src="${f.src}"></audio></div>`}
function mediaMarkup(f,full=false){if(f.kind==='photo')return full?`<div class="photo-trigger">${svgPhoto(f)}</div>`:`<button class="photo-trigger" data-action="fullscreen" aria-label="На весь экран">${svgPhoto(f)}</button>`;
if(f.kind==='video')return `<div class="video-shell"><video controls playsinline preload="metadata" src="${f.src}"></video>${!full?`<button class="video-maximize" aria-label="На весь экран" data-action="fullscreen">${use('max')}</button>`:''}${f.trim?`<span class="clip-indicator">${ftime(f.trim[0])} – ${ftime(f.trim[1])}</span>`:''}</div>`;
return audioGraphic(f,full)}
function wirePlayer(root,f){const media=root.querySelector('video,audio');if(!media)return;activePlayers.push(media);
if(f.kind==='video'){media.addEventListener('loadedmetadata',()=>{if(f.trim && media.currentTime<f.trim[0])media.currentTime=f.trim[0]});media.addEventListener('timeupdate',()=>{if(f.trim&&media.currentTime>=f.trim[1]){media.pause();media.currentTime=f.trim[0]}});return}
const play=root.querySelector('[data-action=toggle-audio]'),range=root.querySelector('.audio-progress'),time=root.querySelector('.audio-time'),bars=[...root.querySelectorAll('.audio-wave i')];
const update=()=>{const t=Math.min(media.duration||f.duration||0,media.currentTime||0);range.value=String(t);time.textContent=ftime(t)+' / '+ftime(f.duration);bars.forEach((el,i)=>el.classList.toggle('played',i/Math.max(bars.length,1)<t/Math.max(1,f.duration)))};
media.addEventListener('timeupdate',()=>{if(f.trim&&media.currentTime>=f.trim[1]){media.pause();media.currentTime=f.trim[0]}update()});media.addEventListener('pause',()=>{play.innerHTML=use('play')});media.addEventListener('play',()=>{play.innerHTML=use('pause')});media.addEventListener('loadedmetadata',update);range.addEventListener('input',()=>{media.currentTime=Number(range.value);update()});play.addEventListener('click',()=>{if(media.paused){if(f.trim&&(media.currentTime<f.trim[0]||media.currentTime>=f.trim[1]))media.currentTime=f.trim[0];media.play().catch(()=>logEvent('Ошибка','Аудио недоступно'))}else media.pause()})}
function render(){const f=current();cleanupPlayers();const outer=$('#media-content'),full=$('#full-content');if(!f){outer.innerHTML='';full.innerHTML='';$('#file-name').textContent='Нет файлов';$('#file-description').textContent='';$('#page-count').textContent='0 / 0';return}
outer.innerHTML=mediaMarkup(f);if(!$('#fullscreen-layer').hidden){full.innerHTML=mediaMarkup(f,true)}else full.innerHTML='';
wirePlayer(outer,f);if(!$('#fullscreen-layer').hidden)wirePlayer(full,f);
$('#file-name').textContent=f.name;$('#file-id').textContent=f.id;$('#file-description').textContent=f.description;$('#file-created').textContent=f.created;$('#file-expiration').innerHTML=escapeHTML(f.expiration)+` <em style="color:#b39b7d;font-style:normal;font-size:10px">· ${f.days} дней</em>`;$('#page-count').textContent=`${idx+1} / ${files.length}`;$('#fullscreen-count').textContent=`${idx+1} / ${files.length}`;
const fav=$('[data-action=favorite]');fav.classList.toggle('is-favorite',!!f.favorite);fav.setAttribute('aria-pressed',String(!!f.favorite));
const copy=$('[data-action=copy]');copy.disabled=f.kind==='audio';copy.title=f.kind==='video'?'Копировать стоп-кадр':f.kind==='photo'?'Копировать сжатую копию':'Недоступно для аудио';copy.setAttribute('aria-label',copy.title);$('[data-action=delete]').disabled=!f.deletable;$('[data-action=edit]').disabled=!f.editable;$$('[data-action=previous]').forEach(b=>b.disabled=idx===0);$$('[data-action=next]').forEach(b=>b.disabled=idx===files.length-1);
}
function move(delta){if(isNavigating)return;const next=idx+delta;if(next<0||next>=files.length)return;isNavigating=true;closeDownload();const target=$('#media-content');if(!reduced()&&target.animate)target.animate([{opacity:1,transform:'translateX(0)'},{opacity:.3,transform:`translateX(${-delta*18}px)`}],{duration:95});idx=next;render();if(!reduced()&&target.animate)target.animate([{opacity:.3,transform:`translateX(${delta*25}px)`},{opacity:1,transform:'translateX(0)'}],{duration:190});isNavigating=false}
function openSheet(title,markup){closeDownload();clearTimeout(sheetTimer);$('#sheet-title').textContent=title;$('#sheet-content').innerHTML=markup;$('#sheet-layer').hidden=false;requestAnimationFrame(()=>$('#sheet-layer').classList.add('visible'));$('#sheet-layer .viewer-sheet').focus()}
function closeSheet(){const layer=$('#sheet-layer');layer.classList.remove('visible');clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>{if(!layer.classList.contains('visible'))layer.hidden=true},reduced()?0:300)}
function closeDownload(){$('#download-pop').hidden=true}
const option=(a,txt,extra='')=>`<button data-action="${a}" class="${extra}">${escapeHTML(txt)}</button>`;
const infoRow=(name,val)=>`<div><dt>${escapeHTML(name)}</dt><dd>${escapeHTML(val)}</dd></div>`;
function openInfo(){const f=current();let d='<div class="description-card"><strong>Полное описание</strong><p>'+escapeHTML(f.description||'Описание отсутствует')+'</p></div>';let rows=[['NAME-ID',f.id],['Название',f.name],['Тип',f.kind==='photo'?'Фото':f.kind==='video'?'Видео':'Аудио'],['Формат',f.format],['Задание','Фасады — Site A'],['Папка','Детали фасада'],['Автор',f.author],['Категория',f.category],['Создано',f.created],['Удаление',f.expiration+' · '+f.days+' дней']];if(f.resolution)rows.push(['Разрешение',f.resolution]);if(f.duration)rows.push(['Длительность',ftime(f.duration)]);if(f.trim)rows.push(['Фрагмент',ftime(f.trim[0])+' – '+ftime(f.trim[1])]);openSheet('Информация о файле',d+'<dl>'+rows.map(([k,v])=>infoRow(k,v)).join('')+'</dl>')}
function openEdit(){const f=current();if(!f)return;
if(f.kind==='photo'){openSheet('Редактировать фото','<div class="description-card"><strong>Информация</strong><p>Основной редактор фотографий остаётся отдельным экраном.</p></div>'+`<label>Название<input name="name" maxlength="120" value="${escapeHTML(f.name)}"></label><label>Описание<textarea name="description">${escapeHTML(f.description)}</textarea></label>`+option('save-meta','Сохранить изменения','primary'));return}
const start=f.trim?.[0]||0,end=f.trim?.[1]||f.duration;
openSheet(f.kind==='video'?'Редактировать видео':'Редактировать аудио',`<div class="description-card"><strong>Обрезка</strong><p>Выберите начало и конец фрагмента.</p></div><div class="range-box"><label>Начало <output id="trim-start-label">${ftime(start)}</output><input id="trim-start" type="range" min="0" max="${f.duration}" step="0.1" value="${start}"></label><label>Конец <output id="trim-end-label">${ftime(end)}</output><input id="trim-end" type="range" min="0" max="${f.duration}" step="0.1" value="${end}"></label></div><div class="editor-actions">${option('preview-trim','Просмотреть фрагмент')}${option('save-trim','Применить границы','primary')}${f.kind==='video'?option('frame','Создать стоп-кадр'):''}${f.kind==='audio'?option('export-audio','Сохранить обрезанное аудио'):''}</div>`);
const a=$('#trim-start'),b=$('#trim-end');a.addEventListener('input',()=>{if(+a.value>=+b.value)a.value=Math.max(0,+b.value-.1);$('#trim-start-label').textContent=ftime(+a.value)});b.addEventListener('input',()=>{if(+b.value<=+a.value)b.value=Math.min(f.duration,+a.value+.1);$('#trim-end-label').textContent=ftime(+b.value)})}
function currentBounds(){return [Number($('#trim-start').value),Number($('#trim-end').value)]}
function trimPreview(){const f=current();const bounds=currentBounds();if(bounds[1]<=bounds[0])return;f.trim=bounds;closeSheet();render();const media=$('#media-content video,#media-content audio');if(media){media.currentTime=bounds[0];media.play().catch(()=>{})}logEvent('Фрагмент',ftime(bounds[0])+' – '+ftime(bounds[1]))}
async function frameAt(f,at){const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;v.src=f.src;await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej});const target=Math.max(0,Math.min(v.duration-.05,at));v.currentTime=target;await new Promise((res,rej)=>{v.onseeked=res;v.onerror=rej});const c=document.createElement('canvas');c.width=v.videoWidth||320;c.height=v.videoHeight||200;c.getContext('2d').drawImage(v,0,0,c.width,c.height);v.removeAttribute('src');v.load();return c.toDataURL('image/jpeg',.9)}
async function makeFrame(){const f=current();if(f.kind!=='video')return;const time=$('#trim-start')?Number($('#trim-start').value):0;try{const img=await frameAt(f,time);const newFile={id:'FRAME'+String(Date.now()).slice(-4),name:'Стоп-кадр · '+f.name,kind:'photo',img,description:'Стоп-кадр из видео, '+ftime(time),created:'Сегодня',expiration:f.expiration,days:f.days,author:'Вы',category:f.category,format:'JPEG',resolution:'320 × 200',favorite:false,editable:true,deletable:true};files.splice(idx+1,0,newFile);closeSheet();move(1);logEvent('Стоп-кадр','Новая фотография добавлена')}catch(e){logEvent('Ошибка','Не удалось извлечь кадр: '+e.message);openSheet('Стоп-кадр','<div class="note">Не удалось получить кадр из этого видео.</div>')}}
async function exportAudio(){const f=current();if(f.kind!=='audio')return;const bounds=currentBounds();try{const resp=await fetch(f.src);const arr=await resp.arrayBuffer();const ctx=new (window.AudioContext||window.webkitAudioContext)();const decoded=await ctx.decodeAudioData(arr);let start=Math.floor(bounds[0]*decoded.sampleRate),end=Math.floor(bounds[1]*decoded.sampleRate),length=Math.max(1,end-start),n=decoded.numberOfChannels,sr=decoded.sampleRate;const blob=new Uint8Array(44+length*n*2);const view=new DataView(blob.buffer);function str(i,s){for(let j=0;j<s.length;j++)view.setUint8(i+j,s.charCodeAt(j))}str(0,'RIFF');view.setUint32(4,36+length*n*2,true);str(8,'WAVE');str(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,n,true);view.setUint32(24,sr,true);view.setUint32(28,sr*n*2,true);view.setUint16(32,n*2,true);view.setUint16(34,16,true);str(36,'data');view.setUint32(40,length*n*2,true);for(let i=0;i<length;i++)for(let c=0;c<n;c++){const v=Math.max(-1,Math.min(1,decoded.getChannelData(c)[start+i]||0));view.setInt16(44+(i*n+c)*2,v<0?v*0x8000:v*0x7fff,true)}await ctx.close();const url=URL.createObjectURL(new Blob([blob],{type:'audio/wav'}));recordedUrl.push(url);files.splice(idx+1,0,{...f,id:'CUT'+String(Date.now()).slice(-4),name:'Фрагмент · '+f.name,src:url,format:'WAV',duration:bounds[1]-bounds[0],trim:null,description:'Обрезанная аудиозапись',created:'Сегодня'});closeSheet();move(1);logEvent('Аудио','Фрагмент добавлен как отдельный файл')}catch(e){logEvent('Ошибка','Не удалось обрезать запись');openSheet('Ошибка','<div class="note">Не удалось создать аудиофрагмент в этом браузере.</div>')}}
function openWeb(){const f=current();if(f.kind==='photo')$('#web-media').innerHTML=svgPhoto(f);else $('#web-media').innerHTML=f.kind==='video'?`<div style="font-size:45px;color:#444">▶</div>`:use('music');$('#web-title').textContent=f.name;$('#web-id').textContent=f.id;$('#web-description').textContent=f.description;$('#web-layer').hidden=false;requestAnimationFrame(()=>$('#web-layer').classList.add('visible'))}
function closeWeb(){const layer=$('#web-layer');layer.classList.remove('visible');clearTimeout(webTimer);webTimer=setTimeout(()=>{if(!layer.classList.contains('visible'))layer.hidden=true},reduced()?0:300)}
function openFull(){if(!current())return;$('#fullscreen-layer').hidden=false;$('#fullscreen-layer').classList.remove('exit-up','exit-down');$('#fullscreen-layer').classList.add('enter');render();$('#fullscreen-layer').focus()}
function closeFull(dir=1){const layer=$('#fullscreen-layer');if(layer.hidden)return;layer.classList.remove('enter','exit-up','exit-down');layer.classList.add(dir<0?'exit-up':'exit-down');clearTimeout(fullTimer);fullTimer=setTimeout(()=>{layer.hidden=true;layer.classList.remove('exit-up','exit-down');render()},reduced()?0:240)}
async function imageBlob(f){const svg=f.img?null:svgPhoto(f);const uri=f.img||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);const image=new Image();image.src=uri;await image.decode();const portrait=(f.art==='portrait');const canvas=document.createElement('canvas');canvas.width=portrait?650:900;canvas.height=portrait?975:600;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Canvas')),'image/jpeg',.82))}
async function copyCurrent(){const f=current();if(f.kind==='audio')return;try{let blob;if(f.kind==='photo')blob=await imageBlob(f);else{let src=await frameAt(f,f.trim?.[0]||0);blob=await (await fetch(src)).blob()}if(navigator.clipboard?.write&&window.ClipboardItem){const png=await createPng(blob);await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);logEvent('Копирование','Изображение скопировано')}else throw Error('Clipboard API unavailable')}catch{logEvent('Копирование','Копирование изображений недоступно в этом браузере')}}
async function createPng(blob){const bitmap=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;c.getContext('2d').drawImage(bitmap,0,0);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('PNG')),'image/png'))}
async function downloadCurrent(){const f=current();try{let href=f.src,filename=`${f.id}.${f.format.toLowerCase()}`;if(f.kind==='photo'){const blob=await imageBlob(f);href=URL.createObjectURL(blob);filename=f.id+'.jpg';recordedUrl.push(href)}const a=document.createElement('a');a.href=href;a.download=filename;document.body.appendChild(a);a.click();a.remove();logEvent('Скачивание',filename)}catch{logEvent('Ошибка','Не удалось подготовить файл')}closeDownload()}
function openStatus(){openSheet('Состояние приложения','<div class="note"><strong>В работе</strong></div>'+logs.map(x=>`<div class="log-item"><i class="log-led"></i><div><strong>${escapeHTML(x.t)} · ${x.at}</strong><small>${escapeHTML(x.detail)}</small></div></div>`).join(''))}
function navInfo(t){openSheet('Browser','<div class="note">'+escapeHTML(t)+': переход вернёт в соответствующую папку каталога.</div>')}
function deletePrompt(){const f=current();openSheet('Удалить файл','<div class="description-card"><strong>'+escapeHTML(f.name)+'</strong><p>Удалить выбранный файл?</p></div>'+option('confirm-delete','Удалить','danger'))}
function saveMeta(){const f=current();f.name=$('#sheet-content [name=name]').value.trim()||f.name;f.description=$('#sheet-content [name=description]').value;closeSheet();render();logEvent('Изменение','Информация обновлена')}
function deleteFile(){files.splice(idx,1);idx=Math.min(idx,files.length-1);idx=Math.max(idx,0);closeSheet();render();logEvent('Удалено','Файл удалён из списка')}
$('#app').addEventListener('click',event=>{const btn=event.target.closest('button');if(!btn||!$('#app').contains(btn))return;if(btn.dataset.nav){navInfo(btn.dataset.nav);return}const a=btn.dataset.action;switch(a){case 'status':openStatus();break;case 'favorite':current().favorite=!current().favorite;render();break;case 'copy':void copyCurrent();break;case 'download':$('#download-pop').hidden=false;break;case 'cancel-download':closeDownload();break;case 'confirm-download':void downloadCurrent();break;case 'delete':deletePrompt();break;case 'info':openInfo();break;case 'edit':openEdit();break;case 'public':openWeb();break;case 'previous':move(-1);break;case 'next':move(1);break;case 'fullscreen':openFull();break;case 'close-fullscreen':closeFull();break;case 'close-sheet':closeSheet();break;case 'close-web':closeWeb();break;case 'preview-trim':trimPreview();break;case 'save-trim':{const f=current();const b=currentBounds();f.trim=b;closeSheet();render();logEvent('Обрезка',ftime(b[0])+' – '+ftime(b[1]));break}case 'frame':void makeFrame();break;case 'export-audio':void exportAudio();break;case 'save-meta':saveMeta();break;case 'confirm-delete':deleteFile();break;case 'back':navInfo('Детали фасада');break;case 'path':navInfo(btn.dataset.location||'Browser');break;}});
$$('[data-device]').forEach(b=>b.addEventListener('click',()=>{$('#device').className='device '+b.dataset.device;$$('[data-device]').forEach(x=>{const chosen=x===b;x.classList.toggle('selected',chosen);x.setAttribute('aria-pressed',String(chosen))})}));
$('#sheet-layer').addEventListener('click',e=>{if(e.target.id==='sheet-layer')closeSheet()});$('#web-layer').addEventListener('click',e=>{if(e.target.id==='web-layer')closeWeb()});
$('#app').addEventListener('click',e=>{if(!e.target.closest('#download-pop,[data-action=download]'))closeDownload()});
$('#app').addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,video,audio'))return;if(e.key==='Escape'){if(!$('#web-layer').hidden)closeWeb();else if(!$('#sheet-layer').hidden)closeSheet();else if(!$('#fullscreen-layer').hidden)closeFull();else closeDownload();return}if(!$('#sheet-layer').hidden||!$('#web-layer').hidden||!$('#download-pop').hidden)return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
// Swipes: horizontal switches files; vertical closes fullscreen; don't capture media controls.
function gesture(node,full){let start=null;node.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,video,audio'))return;start={id:e.pointerId,x:e.clientX,y:e.clientY};});node.addEventListener('pointerup',e=>{if(!start||start.id!==e.pointerId)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.25){move(dx<0?1:-1)}else if(full&&Math.abs(dy)>86&&Math.abs(dy)>Math.abs(dx)*1.25)closeFull(Math.sign(dy))});node.addEventListener('pointercancel',()=>{start=null})}
gesture($('#image-stage'),false);gesture($('#fullscreen-media'),true);
window.addEventListener('pagehide',()=>recordedUrl.forEach(url=>URL.revokeObjectURL(url)));render();
})();
</script>
</body></html>
