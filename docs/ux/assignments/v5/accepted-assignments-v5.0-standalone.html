function effectiveFinish(t){if(t.end)return {date:t.end,from:'Окончание'};const opts=[t.autoFiles,t.autoTask].filter(Boolean).sort();return opts.length?{date:opts[0],from:'По автоудалению'}:{date:'',from:'Окончание'}}
function getStats(t){const selected=mediaOrder.filter(k=>t.media[k]&&Number.isFinite(t.media[k].target)&&t.media[k].target>0);const target=selected.reduce((sum,k)=>sum+t.media[k].target,0),done=selected.reduce((sum,k)=>sum+Math.min(t.media[k].target,t.media[k].count),0),totalMedia=Object.values(t.media).reduce((sum,x)=>sum+x.count,0);return {target,done,totalMedia,percent:target?Math.round(done/target*100):null}}
function renderMedia(t){const st=getStats(t);return `<div class="media-summary"><strong>Материалы</strong>${st.percent!==null?`<b>${st.percent}%</b>`:''}</div><div class="media-list">${mediaOrder.filter(k=>t.media[k]).map(k=>{const m=t.media[k],bounded=m.target>0,pct=bounded?Math.min(100,m.count/m.target*100):0;return `<div class="media-item"><div class="media-head">${icon(k==='photo'?'camera':k)}<span class="media-name">${mediaLabels[k]}</span><strong class="media-value">${m.count}${bounded?` <em>/ ${m.target}</em>`:''}</strong></div>${bounded?`<div class="media-mini-track"><i style="width:${pct}%"></i></div>`:''}</div>`}).join('')}</div>${st.percent!==null?`<div class="task-total"><span>Выполнено по целям</span><strong>${st.done} <span>/ ${st.target}</span></strong></div><div class="task-track"><i style="width:${st.percent}%"></i></div>`:''}`}
function taskCard(t){const finish=effectiveFinish(t),st=getStats(t),status=t.done?'Завершено':t.planned?'Запланировано':'В работе',statusClass=t.done?'done':t.planned?'planned':'';const fileCount=st.totalMedia;const canCapture=t.canCapture&&!t.done&&!(t.planned&&t.blockBefore);const canBrowse=t.canBrowse&&fileCount>0;const audioOnly=Object.keys(t.media).length===1&&!!t.media.audio;return `<article class="task-card" data-task-id="${esc(t.id)}"><div class="task-card-top"><span class="task-avatar ${esc(t.tone)}">${icon(t.icon)}</span><button type="button" class="task-title" data-action="details" data-id="${esc(t.id)}"><strong>${esc(t.name)}</strong><span class="task-subline"><span class="task-state ${statusClass}">${status}</span><span class="task-members">${icon('users')}${t.participants}</span>${t.team?`<span class="task-team">${esc(t.team)}</span>`:''}</span></button><button type="button" class="task-more" data-action="menu" data-id="${esc(t.id)}" aria-label="Действия: ${esc(t.name)}">•••</button></div><p class="task-description">${esc(t.description)}</p><div class="task-dates"><div><small>Начало</small><strong>${dateText(t.start)}</strong></div><div><small>${finish.from}</small><strong>${dateText(finish.date)}</strong></div><div><small>Длительность</small><strong>${duration(t.start,finish.date)}</strong></div></div>${(t.autoFiles||t.autoTask)?`<div class="task-expiry">${t.autoFiles?`<span class="expiry-chip">${icon('clock')}Файлы: ${dateText(t.autoFiles)}</span>`:''}${t.autoTask?`<span class="expiry-chip danger">${icon('trash')}Задание: ${dateText(t.autoTask)}</span>`:''}</div>`:''}${renderMedia(t)}${canCapture||canBrowse?`<div class="task-actions">${canCapture?`<button type="button" class="primary" data-action="capture" data-id="${esc(t.id)}">${icon(audioOnly?'audio':'camera')}${audioOnly?'Записать':'Снимать'}</button>`:''}${canBrowse?`<button type="button" data-action="browse" data-id="${esc(t.id)}">${icon('folder')}Browser</button>`:''}</div>`:''}</article>`}
function renderList(){document.getElementById('total-count').textContent=tasks.length;document.getElementById('active-count').textContent=tasks.filter(t=>!t.done).length;document.getElementById('done-count').textContent=tasks.filter(t=>t.done).length;app.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===state.tab;b.classList.toggle('selected',on);b.setAttribute('aria-selected',String(on))});const q=state.query.toLowerCase();const rows=tasks.filter(t=>(state.tab==='all'||(state.tab==='archive'?t.done:!t.done))&&(t.name+' '+t.description+' '+t.team+' '+Object.keys(t.media).map(k=>mediaLabels[k]).join(' ')+' '+t.id).toLowerCase().includes(q));rows.sort((a,b)=>state.sort==='media'?getStats(b).totalMedia-getStats(a).totalMedia:state.sort==='edited'?b.edited-a.edited:state.sort==='finish'?((effectiveFinish(a).date||'9999').localeCompare(effectiveFinish(b).date||'9999')):b.created-a.created);list.innerHTML=rows.length?rows.map(taskCard).join(''):'<div class="empty-state">Задания не найдены</div>'}
const action=(k,label,id,danger=false)=>`<button type="button" data-action="${k}" data-id="${esc(id||'')}" ${danger?'class="danger"':''}>${label}</button>`;
function openDialog(kind,id=''){state.lastFocus=document.activeElement;state.dialog=kind;state.selected=id;const t=find(id);let title='',content='';if(kind==='status'){title='Состояние PhotoBunker';content='<div class="dialog-note">В работе. Доступ к сохранённым материалам определяется правами и синхронизацией.</div>'}else if(kind==='settings'){title='Настройки заданий';content='<label class="dialog-select">Сортировка<select id="sort-select"><option value="created">Дата создания</option><option value="edited">Дата изменения</option><option value="media">Количество материалов</option><option value="finish">Дата завершения</option></select></label>'+action('sort','Применить','')}else if(kind==='menu'&&t){title=t.name;content=action('details','Открыть задание',id)+(t.canManage?action('edit','Редактировать',id):'')+action('duplicate','Дублировать',id)+(t.canManage?action('toggle',t.done?'Возобновить':'Завершить',id)+action('delete','Удалить задание',id,true):'')}else if(kind==='confirm-delete'&&t){title='Удалить задание?';content=`<div class="dialog-note">Удаление «${esc(t.name)}» не должно автоматически удалять личные копии других участников. В этой версии удаляется только запись в списке.</div>`+action('delete-confirm','Удалить задание',id,true)+action('close','Отмена','')}else if(kind==='details'&&t){title=t.name;const finish=effectiveFinish(t);content=`<div class="dialog-note"><strong>${esc(t.name)}</strong><p>${esc(t.description)}</p><div class="dialog-rule">Начало: ${dateText(t.start)} · Завершение: ${dateText(finish.date)}</div>${t.autoFiles?`<div class="dialog-rule">Автоудаление файлов: ${dateText(t.autoFiles)}</div>`:''}${t.autoTask?`<div class="dialog-rule">Автоудаление задания: ${dateText(t.autoTask)}${t.deleteFilesWithTask?' · вместе с файлами задания':''}</div>`:''}${mediaOrder.filter(k=>t.media[k]).map(k=>`<div class="dialog-rule">${mediaLabels[k]}: ${t.media[k].count}${t.media[k].target?' / '+t.media[k].target:''}</div>`).join('')}</div>`+(t.canBrowse&&getStats(t).totalMedia?action('browse','Открыть Browser',id):'')+(t.canManage?action('edit','Редактировать задание',id):'')}else if(kind==='capture'||kind==='browse'||kind==='nav'){title=kind==='capture'?'Создание материала':kind==='browse'?'Browser':id;content=`<div class="dialog-note">${kind==='capture'?'Запуск записи или камеры':'Переход к материалам'} с контекстом задания${t?' «'+esc(t.name)+'»':''}. В настоящем приложении используются разрешённые типы файлов и права задания.</div>`}else if(kind==='editor'){title='Редактор задания';content='<div class="dialog-note">Утверждённый Assignment Editor Media 2.2 включает все четыре вкладки: Основное, Файлы, Участники, Правила.</div><a href="assignment_editor_media_2_2.html" target="_blank" rel="noopener" class="submit">Открыть редактор 2.2</a>'}else{return}dlgTitle.textContent=title;dlgContent.innerHTML=content;if(kind==='settings')document.getElementById('sort-select').value=state.sort;overlay.hidden=false;dlg.focus()}
function closeDialog(){overlay.hidden=true;state.dialog='';if(state.lastFocus&&state.lastFocus.isConnected)state.lastFocus.focus();state.lastFocus=null}
let toastTimer;function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2200)}
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!app.contains(b))return;const tab=b.dataset.tab,nav=b.dataset.nav,name=b.dataset.action,id=b.dataset.id,t=find(id);if(tab){state.tab=tab;renderList();return}if(nav){if(nav!=='Задания')openDialog('nav',nav);return}if(!name)return;if(name==='search'){searchBox.hidden=!searchBox.hidden;if(searchBox.hidden){state.query='';search.value='';renderList()}else search.focus();return}if(['status','settings','menu','details','capture','browse'].includes(name)){openDialog(name,id);return}if(name==='create'||name==='edit'){openDialog('editor',id);return}if(name==='close'){closeDialog();return}if(name==='sort'){state.sort=document.getElementById('sort-select').value;closeDialog();renderList();return}if(name==='toggle'&&t&&t.canManage){t.done=!t.done;if(!t.done)t.planned=false;closeDialog();renderList();notify(t.done?'Задание завершено':'Задание возобновлено');return}if(name==='duplicate'&&t){const clone=JSON.parse(JSON.stringify(t));clone.id='L-'+Math.floor(Math.random()*99999);clone.name=t.name+' — копия';clone.media=Object.fromEntries(Object.entries(t.media).map(([k,v])=>[k,{...v,count:0}]));clone.done=false;clone.planned=false;clone.created=Date.now();clone.edited=Date.now();tasks.unshift(clone);state.tab='active';closeDialog();renderList();notify('Создана копия задания');return}if(name==='delete'&&t){openDialog('confirm-delete',id);return}if(name==='delete-confirm'&&t){tasks.splice(tasks.indexOf(t),1);closeDialog();renderList();notify('Задание удалено из списка');return}});
search.addEventListener('input',()=>{state.query=search.value;renderList()});document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{device.className='device '+b.dataset.device;document.querySelectorAll('[data-device]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})}));overlay.addEventListener('click',ev=>{if(ev.target===overlay)closeDialog()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!overlay.hidden){ev.preventDefault();closeDialog()}});renderList();
})();
</script>
