<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>PhotoBunker · PIN Shell 1.1 · Fieldwork</title><style>
:root{color-scheme:dark;--green:#1ed760;--bg:#121212;--surface:#202020;--text:#f2f2f2;--muted:#a4a4a4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:#101010;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #a9eeba;outline-offset:3px}
.preview-bar{max-width:1050px;margin:16px auto 12px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.preview-label{display:flex;align-items:center;gap:8px;font:700 11px ui-monospace,monospace;letter-spacing:.045em}.preview-label i{width:7px;height:7px;border-radius:50%;background:var(--green)}.preview-options{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.preview-modes{display:flex;gap:2px;background:#292929;border-radius:8px;padding:3px}.preview-modes button{border:0;background:none;color:#aaa;padding:8px 12px;border-radius:5px;font-size:11px;min-width:40px}.preview-modes button.selected{background:#555;color:#fff}.preview-stage{display:flex;justify-content:center;padding:2px 12px}.device{width:100%;height:min(780px,calc(100dvh - 120px));min-height:570px;border:1px solid #444;background:#121212;overflow:hidden}.device.phone{max-width:402px;border-radius:23px}.device.desktop{max-width:1050px;border-radius:11px}.preview-note{max-width:1050px;margin:11px auto 25px;padding:0 12px;color:#919191;font-size:11px;line-height:1.5}.preview-note strong{color:#c9e8d0;font-weight:600}
.pin-screen{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse 65% 38% at 50% 47%,#1733213a,transparent 72%),#121212}
.pin-container{height:100%;width:min(100%,390px);min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(24px,5.1vh,48px) 18px clamp(22px,4vh,40px);position:relative;z-index:1}
.pin-brand{display:flex;align-items:center;flex-direction:column;gap:7px;flex:0 0 auto}.brand-logo{height:54px;width:54px;display:grid;place-items:center;border:1px solid #454e45;background:linear-gradient(140deg,#2b382b,#171e18);border-radius:16px;box-shadow:0 8px 24px #0003}.brand-logo svg{width:37px;height:37px;color:#f3fff4}.brand-title{font-size:20px;line-height:1.2;font-weight:780;letter-spacing:-.055em;color:#f2f2f2}
.pin-instructions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:120px;margin-top:auto;margin-bottom:auto}.pin-instructions h1{font-size:21px;line-height:1.15;margin:0;font-weight:760;letter-spacing:-.04em;text-align:center}.pin-instructions p{font-size:12px;color:var(--muted);line-height:1.4;margin:0;min-height:17px;text-align:center}.pin-indicators{display:flex;justify-content:center;align-items:center;gap:15px;min-height:20px}.pin-indicators span{width:11px;height:11px;border:1.5px solid #8d978f;background:transparent;border-radius:50%;transition:background .12s,border-color .12s,transform .13s}.pin-indicators span.filled{background:var(--green);border-color:var(--green);transform:scale(1.04)}.pin-indicators.invalid{animation:shake .3s ease}.pin-indicators.complete span{background:var(--green);border-color:var(--green)}.pin-instructions .pin-error{color:#efb4ae}.pin-instructions .pin-success{color:#b6efc5}
.keypad{width:min(100%,248px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px;flex:0 0 auto}.digit{height:54px;min-width:0;border:1px solid #383838;background:#232323e8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:430;line-height:1;transition:background .12s,transform .08s,border-color .1s;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}.digit:hover{background:#303330;border-color:#4e6453}.digit:active{background:#32513b;transform:scale(.96)}.digit.aux{background:transparent;border-color:transparent;color:#b8c0b9}.digit.aux svg{height:24px;width:24px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}.keypad-spacer{display:block;min-height:54px}.pin-foot{flex:0 0 auto;min-height:22px;margin-top:10px;text-align:center}.pin-foot span{font-size:11px;color:#a6aaa6;opacity:.8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
@media(max-height:680px){.pin-container{padding-top:20px;padding-bottom:16px}.pin-brand{gap:4px}.brand-logo{height:47px;width:47px;border-radius:14px}.brand-logo svg{width:33px;height:33px}.brand-title{font-size:19px}.pin-instructions{gap:12px;min-height:103px}.pin-instructions h1{font-size:20px}.digit{height:49px;font-size:24px}.keypad{gap:5px 7px}.pin-foot{margin-top:7px}}
@media(min-width:700px){.device.desktop .pin-container{padding-top:55px;padding-bottom:45px}.device.desktop .keypad{width:254px}.device.desktop .digit{height:56px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition:none!important}}
</style></head><body>
<div class="preview-bar"><span class="preview-label"><i></i>FIELDWORK / PIN SHELL 1.1</span><div class="preview-options"><div class="preview-modes" id="pin-length" role="group" aria-label="Длина PIN"><button data-length="4" class="selected" aria-pressed="true">4 цифры</button><button data-length="5" aria-pressed="false">5</button><button data-length="6" aria-pressed="false">6</button><button data-length="7" aria-pressed="false">7</button><button data-length="8" aria-pressed="false">8</button></div><div class="preview-modes" role="group" aria-label="Размер экрана"><button data-device="phone" class="selected" aria-pressed="true">Телефон</button><button data-device="desktop" aria-pressed="false">Desktop</button></div></div></div>
<div class="preview-stage"><div class="device phone" id="device"><main class="pin-screen" aria-label="Разблокировка PhotoBunker"><div class="pin-container">
<header class="pin-brand"><div class="brand-logo"><svg viewBox="0 0 72 72" fill="none" aria-hidden="true"><rect x="9" y="17" width="54" height="39" rx="10" stroke="currentColor" stroke-width="3"/><path d="m19 17 5-7h24l5 7" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="37" r="13" stroke="#18d65c" stroke-width="3"/><path d="M36 26c6 3 9 8 10 13M27 42c5 3 11 4 16 1M32 27c-6 4-8 10-7 15" stroke="#a9f2b9" stroke-width="2.6" stroke-linecap="round"/></svg></div><div class="brand-title">PhotoBunker</div></header>
<section class="pin-instructions" aria-labelledby="pin-title"><h1 id="pin-title">Введите PIN</h1><div id="indicators" class="pin-indicators" role="status" aria-label="Введено 0 из 4 цифр"></div><p id="pin-feedback" aria-live="polite"></p></section>
<div class="keypad" id="keys" role="group" aria-label="Цифровая клавиатура">
<button type="button" class="digit" data-key="1" aria-label="1">1</button><button type="button" class="digit" data-key="2" aria-label="2">2</button><button type="button" class="digit" data-key="3" aria-label="3">3</button>
<button type="button" class="digit" data-key="4" aria-label="4">4</button><button type="button" class="digit" data-key="5" aria-label="5">5</button><button type="button" class="digit" data-key="6" aria-label="6">6</button>
<button type="button" class="digit" data-key="7" aria-label="7">7</button><button type="button" class="digit" data-key="8" aria-label="8">8</button><button type="button" class="digit" data-key="9" aria-label="9">9</button>
<span class="keypad-spacer" aria-hidden="true"></span><button type="button" class="digit" data-key="0" aria-label="0">0</button><button type="button" class="digit aux" data-key="back" aria-label="Удалить последнюю цифру" title="Удалить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H21V19H10L3 12Z"/><path d="m13 9 5 6m0-6-5 6"/></svg></button>
</div><footer class="pin-foot"><span>Защищённый вход</span></footer>
</div></main></div></div>
<div class="preview-note">Для проверки: <strong>PIN <span id="demo-code">2468</span></strong>. Клавиатура принимает нажатия мышью, касаниями и физическими клавишами; Backspace удаляет последнюю цифру. Выбор длины PIN доступен только в панели предпросмотра.</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={digits:'',length:4,busy:false,lockState:'idle',generation:0,failures:0};
const demoCodes={4:'2468',5:'24680',6:'246810',7:'2468101',8:'24681012'};
let pending;
function markIndicators(){const panel=$('#indicators');panel.innerHTML=Array.from({length:state.length},(_,i)=>`<span class="${i<state.digits.length?'filled':''}" aria-hidden="true"></span>`).join('');panel.setAttribute('aria-label',`Введено ${state.digits.length} из ${state.length} цифр`);}
function hint(message='',kind=''){const el=$('#pin-feedback');el.textContent=message;el.className=kind?'pin-'+kind:'';}
function reset(){clearTimeout(pending);state.generation++;state.digits='';state.busy=false;state.lockState='idle';$('#indicators').classList.remove('invalid','complete');hint('');markIndicators();}
function renderControl(){ $$('#pin-length [data-length]').forEach(b=>{const v=Number(b.dataset.length);b.classList.toggle('selected',v===state.length);b.setAttribute('aria-pressed',String(v===state.length))});$('#demo-code').textContent=demoCodes[state.length] }
function setLength(n){if(!Number.isInteger(n)||n<4||n>8)return;state.length=n;reset();renderControl()}
function enter(key){if(state.busy)return;if(key==='back'){state.digits=state.digits.slice(0,-1);markIndicators();hint('');return;}if(!/^\d$/.test(key)||state.digits.length>=state.length)return;state.digits+=key;markIndicators();hint('');if(state.digits.length===state.length){state.busy=true;const g=++state.generation;pending=setTimeout(()=>{if(state.generation!==g)return;const ok=state.digits===demoCodes[state.length];if(ok){state.lockState='success';$('#indicators').classList.add('complete');hint('PIN принят','success');pending=setTimeout(()=>{if(state.generation===g)reset()},1450)}else{state.failures++;state.lockState='error';$('#indicators').classList.add('invalid');hint('Неверный PIN','error');pending=setTimeout(()=>{if(state.generation===g)reset()},900)}},220)}}
$$('[data-device]').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.device;$('#device').className='device '+d;$$('[data-device]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})}));
$$('[data-length]').forEach(b=>b.addEventListener('click',()=>setLength(Number(b.dataset.length))));
$('#keys').addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)enter(b.dataset.key)});
window.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(/^\d$/.test(e.key)){e.preventDefault();enter(e.key)}else if(e.key==='Backspace'){e.preventDefault();enter('back')}else if(e.key==='Escape'){e.preventDefault();reset()}});
renderControl();markIndicators();
})();
</script></body></html>
