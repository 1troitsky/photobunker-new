<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>PhotoBunker · PIN Shell 1.1 · Fieldwork</title><link rel="stylesheet" href="style.css"></head><body>
<div class="preview-bar"><span class="preview-label"><i></i>FIELDWORK / PIN SHELL 1.1</span><div class="preview-options"><div class="preview-modes" id="pin-length" role="group" aria-label="Длина PIN"><button data-length="4" class="selected" aria-pressed="true">4 цифры</button><button data-length="5" aria-pressed="false">5</button><button data-length="6" aria-pressed="false">6</button><button data-length="7" aria-pressed="false">7</button><button data-length="8" aria-pressed="false">8</button></div><div class="preview-modes" role="group" aria-label="Размер экрана"><button data-device="phone" class="selected" aria-pressed="true">Телефон</button><button data-device="desktop" aria-pressed="false">Desktop</button></div></div></div>
<div class="preview-stage"><div class="device phone" id="device"><main class="pin-screen" aria-label="Разблокировка PhotoBunker"><div class="pin-container">
<header class="pin-brand"><div class="brand-logo"><svg viewBox="0 0 72 72" fill="none" aria-hidden="true"><rect x="9" y="17" width="54" height="39" rx="10" stroke="currentColor" stroke-width="3"/><path d="m19 17 5-7h24l5 7" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="36" cy="37" r="13" stroke="#18d65c" stroke-width="3"/><path d="M36 26c6 3 9 8 10 13M27 42c5 3 11 4 16 1M32 27c-6 4-8 10-7 15" stroke="#a9f2b9" stroke-width="2.6" stroke-linecap="round"/></svg></div><div class="brand-title">PhotoBunker</div></header>
<section class="pin-instructions" aria-labelledby="pin-title"><h1 id="pin-title">Введите PIN</h1><div id="indicators" class="pin-indicators" role="status" aria-label="Введено 0 из 4 цифр"></div><p id="pin-feedback" aria-live="polite"></p></section>
<div class="keypad" id="keys" role="group" aria-label="Цифровая клавиатура">
<button type="button" class="digit" data-key="1" aria-label="1">1</button><button type="button" class="digit" data-key="2" aria-label="2">2</button><button type="button" class="digit" data-key="3" aria-label="3">3</button>
<button type="button" class="digit" data-key="4" aria-label="4">4</button><button type="button" class="digit" data-key="5" aria-label="5">5</button><button type="button" class="digit" data-key="6" aria-label="6">6</button>

</div><footer class="pin-foot"><span>Защищённый вход</span></footer>
</div></main></div></div>
<div class="preview-note">Для проверки: <strong>PIN <span id="demo-code">2468</span></strong>. Клавиатура принимает нажатия мышью, касаниями и физическими клавишами; Backspace удаляет последнюю цифру. Выбор длины PIN доступен только в панели предпросмотра.</div>
