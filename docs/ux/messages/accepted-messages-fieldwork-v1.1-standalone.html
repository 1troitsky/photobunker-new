function sheetButton(label,act,ico,extra=''){return `<button type="button" data-sheet-action="${act}" ${extra}>${ico?svg(ico):''}${esc(label)}</button>`}
function messageMenu(id){const m=getMessage(id);if(!m)return;state.selectedMessage=id;openSheet('Сообщение',`<div class="sheet-actions">${sheetButton('Ответить','reply','reply')}${sheetButton('Реакция','react','smile')}${sheetButton('Переслать','forward','forward')}${sheetButton('Скопировать','copy','copy')}${sheetButton(m.pinned?'Открепить':'Закрепить','pin','pin')}${m.me&&m.type==='text'?sheetButton('Редактировать','edit','edit'):''}${m.me?sheetButton('Удалить','delete','trash','class="danger"'):''}</div>`,'message');}
function actionSheet(kind){const c=chat();if(kind==='attach'){openSheet('Добавить вложение',`<div class="sheet-actions">${sheetButton('Фото из Browser','attach-photo','photo')}${sheetButton('Видео из Browser','attach-video','video')}${sheetButton('Аудиофайл / голосовое','attach-audio','audio')}${sheetButton('Документ','attach-file','file')}</div>`,'attach');return}if(kind==='voice'){openSheet('Голосовое сообщение','<div class="sheet-note">В этом макете можно добавить пример голосового сообщения. Запись микрофона не запускается.</div><div class="sheet-actions" style="margin-top:10px">'+sheetButton('Добавить голосовое · 0:09','attach-audio','mic')+'</div>','voice');return}if(kind==='emoji'){openSheet('Эмодзи',`<div class="sheet-tags">${['🙂','👍','❤️','🔥','👌','✅','👏','👀'].map(x=>`<button type="button" data-insert-emoji="${x}">${x}</button>`).join('')}</div>`,'emoji');return}if(kind==='new-chat'){openSheet('Новое сообщение','<div class="sheet-note" style="margin-bottom:10px">Выберите контакт или команду.</div><div class="sheet-list">'+sortChats().map(x=>`<button type="button" data-new-chat="${x.id}">${avatar(x)}<strong>${esc(x.name)}</strong></button>`).join('')+'</div>','new-chat');return}if(kind==='chat-info'){openSheet(c.kind==='team'?'Информация о команде':'Профиль',`<div class="sheet-info"><div class="profile-main">${avatar(c)}<span><strong>${esc(c.name)}</strong><small>${esc(c.handle)}</small></span></div><p>${c.kind==='team'?'Командная переписка · сообщения участников команды.':'Личная переписка · сообщения этого контакта.'}</p><p>В будущем сообщения будут синхронизироваться через отдельный защищённый модуль.</p></div><div class="sheet-actions" style="margin-top:14px">${sheetButton('Поиск в переписке','search-thread','search')}</div>`,'info');return}if(kind==='chat-menu'){openSheet(c.name,`<div class="sheet-actions">${sheetButton('Информация','info','info')}${sheetButton('Поиск сообщений','search-thread','search')}${sheetButton(state.muted.has(c.id)?'Включить уведомления':'Отключить уведомления','mute','mute')}${sheetButton(c.pinned?'Открепить диалог':'Закрепить диалог','pin-chat','pin')}</div>`,'chat-menu');return}if(kind==='app-status'){openSheet('Состояние PhotoBunker','<div class="sheet-note">Сообщения и вложения доступны в локальном макете. Синхронизация с сервером и Matrix не подключены.</div><div class="sheet-actions" style="margin-top:10px">'+sheetButton('Отметить мои сообщения отправленными','mock-sync','check')+'</div>','status');return}if(kind==='nav'){openSheet('Навигация','<div class="sheet-note">Этот раздел использует общий Dock PhotoBunker. Переходы в другие разделы будут подключены вместе с приложением.</div>','nav');}}
async function copyToClipboard(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const inp=document.createElement('textarea');inp.value=text;inp.style.position='fixed';inp.style.opacity='0';document.body.appendChild(inp);inp.select();const ok=document.execCommand('copy');inp.remove();if(!ok)throw new Error('copy');}}catch{openSheet('Копирование','<div class="sheet-note">Буфер обмена недоступен в этом браузере. Выделите и скопируйте текст вручную.</div>','copy-failed')}}
$('#app').addEventListener('click',e=>{const t=e.target.closest('[data-open-chat],[data-action],[data-filter],[data-nav],[data-message-actions],[data-play],[data-toggle-reaction]');if(!t)return;
 if(t.dataset.openChat){switchChat(t.dataset.openChat);return}
 if(t.dataset.filter){state.filter=t.dataset.filter;renderList();return}
 if(t.dataset.nav){actionSheet('nav');return}
 if(t.dataset.messageActions){messageMenu(t.dataset.messageActions);return}
 if(t.dataset.play){const id=Number(t.dataset.play);state.playing=state.playing===id?null:id;renderThread({scroll:false});return}
 if(t.dataset.toggleReaction){const m=getMessage(t.dataset.toggleReaction),em=t.dataset.emoji;if(m){m.reactions??={};m.reactions[em]=!m.reactions[em];if(!m.reactions[em])delete m.reactions[em];renderThread({scroll:false})}return}
 switch(t.dataset.action){case 'app-search':state.searchOpen=!state.searchOpen;renderList();if(state.searchOpen)$('#inbox-search').focus();break;
 case 'new-chat':actionSheet('new-chat');break;case 'app-status':actionSheet('app-status');break;
 case 'back-to-list':backToList();break;case 'chat-info':actionSheet('chat-info');break;case 'chat-menu':actionSheet('chat-menu');break;
 case 'thread-search':state.threadSearchOpen=!state.threadSearchOpen;state.threadQuery='';renderThread({scroll:false});if(state.threadSearchOpen)$('#thread-search').focus();break;
 case 'close-thread-search':state.threadSearchOpen=false;state.threadQuery='';renderThread({scroll:false});break;
 case 'attach':actionSheet('attach');break;case 'emoji':actionSheet('emoji');break;case 'send':sendMessage();break;case 'voice':actionSheet('voice');break;
 case 'cancel-compose':state.edit=null;state.editDraft='';state.reply=null;renderComposer();break;case 'close-sheet':closeSheet();break;
 }});
$('#inbox-search').addEventListener('input',e=>{state.query=e.target.value;renderList()});$('#thread-search').addEventListener('input',e=>{state.threadQuery=e.target.value;renderThread({scroll:false})});
$('#message-input').addEventListener('input',e=>{if(state.edit)state.editDraft=e.target.value;else state.drafts[state.active]=e.target.value;renderComposer();renderList()});
$('#message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});
$('#pinned-banner').addEventListener('click',()=>{const p=chat().messages.find(x=>x.pinned);if(!p)return;const el=$(`[data-message-id="${p.id}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),1500)}});
$('#sheet-body').addEventListener('click',async e=>{const t=e.target.closest('[data-sheet-action],[data-new-chat],[data-insert-emoji]');if(!t)return;
 if(t.dataset.newChat){const id=t.dataset.newChat;closeSheet();switchChat(id);return}
 if(t.dataset.insertEmoji){const val=t.dataset.insertEmoji;const input=$('#message-input');if(state.edit)state.editDraft=(state.editDraft||'')+val;else state.drafts[state.active]=(state.drafts[state.active]||'')+val;closeSheet();renderComposer();renderList();input.focus();return}
 const a=t.dataset.sheetAction,c=chat(),m=getMessage(state.selectedMessage);
 if(a?.startsWith('attach-')){sendMedia(a.slice(7));return}
 if(a==='search-thread'){closeSheet();state.threadSearchOpen=true;state.threadQuery='';renderThread({scroll:false});$('#thread-search').focus();return}
 if(a==='info'){closeSheet();actionSheet('chat-info');return}
 if(a==='mute'){if(state.muted.has(c.id))state.muted.delete(c.id);else state.muted.add(c.id);closeSheet();return}
 if(a==='pin-chat'){c.pinned=!c.pinned;closeSheet();renderList();return}
 if(a==='mock-sync'){chats.forEach(ch=>ch.messages.filter(m=>m.me&&m.status==='queued').forEach(m=>m.status='sent'));closeSheet();renderThread({scroll:false});return}
 if(!m)return;
 if(a==='reply'){state.reply=m.id;state.edit=null;state.editDraft='';closeSheet();renderComposer();$('#message-input').focus();return}
 if(a==='edit'&&m.me&&m.type==='text'){state.edit=m.id;state.editDraft=m.text;state.reply=null;closeSheet();renderComposer();$('#message-input').focus();return}
 if(a==='pin'){const wasPinned=!!m.pinned;c.messages.forEach(x=>x.pinned=false);m.pinned=!wasPinned;closeSheet();renderThread({scroll:false});return}
 if(a==='copy'){const val=messageText(m);closeSheet();await copyToClipboard(val);return}
 if(a==='react'){const id=m.id;closeSheet();state.selectedMessage=id;openSheet('Реакция',`<div class="sheet-tags">${['👍','❤️','🔥','👏','✅','🙂'].map(x=>`<button type="button" data-react="${esc(x)}">${x}</button>`).join('')}</div>`,'reaction');return}
 if(a==='forward'){const id=m.id;closeSheet();state.selectedMessage=id;openSheet('Переслать сообщение','<div class="sheet-list">'+chats.filter(x=>x.id!==state.active).map(x=>`<button type="button" data-forward-to="${x.id}">${avatar(x)}<strong>${esc(x.name)}</strong></button>`).join('')+'</div>','forward');return}
 if(a==='delete'&&m.me){const id=m.id;closeSheet();state.selectedMessage=id;openSheet('Удалить сообщение','<div class="sheet-note">Удалить это сообщение из текущего диалога?</div><div class="sheet-actions" style="margin-top:10px">'+sheetButton('Удалить','confirm-delete','trash','class="danger"')+sheetButton('Отмена','cancel-delete','close')+'</div>','delete');return}
});
$('#sheet-body').addEventListener('click',e=>{const t=e.target.closest('[data-react],[data-forward-to]');if(!t)return;const m=getMessage(state.selectedMessage);if(!m)return;if(t.dataset.react){m.reactions??={};const v=t.dataset.react;m.reactions[v]=!m.reactions[v];if(!m.reactions[v])delete m.reactions[v];closeSheet();renderThread({scroll:false})}else if(t.dataset.forwardTo){const target=chats.find(c=>c.id===t.dataset.forwardTo);if(target){target.messages.push({id:++nextMessageId,me:true,type:'text',text:'Переслано: '+messageText(m),time:'Сейчас',status:'queued'});target.time='Сейчас';target.activity=++nextActivity;}closeSheet();renderList();}});
$('#sheet-body').addEventListener('click',e=>{const t=e.target.closest('[data-sheet-action]');if(!t)return;const act=t.dataset.sheetAction;if(act==='cancel-delete'){closeSheet();return}if(act==='confirm-delete'){const m=getMessage(state.selectedMessage);if(m&&m.me){const c=chat();c.messages=c.messages.filter(x=>x.id!==m.id)}closeSheet();renderList();renderThread({scroll:false})}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden){closeSheet();e.preventDefault()}else if($('#thread').classList.contains('is-open')){backToList();e.preventDefault()}}});
all('[data-device]').forEach(button=>button.addEventListener('click',()=>{state.device=button.dataset.device;$('#device').className='device '+state.device;all('[data-device]').forEach(x=>{x.classList.toggle('selected',x===button);x.setAttribute('aria-pressed',String(x===button))});renderList();renderThread()}));
renderStaticIcons();renderList();renderThread();
})();
</script>
</body>
</html>
