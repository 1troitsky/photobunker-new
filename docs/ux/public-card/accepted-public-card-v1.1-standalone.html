${showGPS?`<section class="info-section"><h2 class="info-title">Местоположение</h2><div class="coord-row"><span class="coordinate">41.64781, 41.63692</span><button class="text-action" type="button" data-action="copy-gps">Копировать координаты</button></div><div class="map-shell">${mapArt}<span class="map-overlay" style="bottom:auto;top:11px">Схема местоположения</span><button class="map-activate" data-action="map-live" type="button">Интерактивная карта</button><div class="map-tools"><button type="button" data-action="map-plus" aria-label="Приблизить карту">+</button><button type="button" data-action="map-minus" aria-label="Отдалить карту">−</button></div><a class="map-open" href="https://www.openstreetmap.org/?mlat=41.64781&mlon=41.63692#map=16/41.64781/41.63692" target="_blank" rel="noopener noreferrer">Открыть карту ↗</a></div></section>`:''}
${expired?'':`<section class="info-section"><h2 class="section-label">Ссылка на карточку</h2><div class="share-row"><span class="share-url">${safeLink}</span><button type="button" class="share-copy" data-action="copy" aria-label="Копировать ссылку">${ic('copy')}</button></div></section>`}
${showExtra?`<section class="info-section"><h2 class="info-title">Дополнительная информация</h2><div class="metadata">${metadataItem('Дата съёмки','6 ноября 2026, 14:32')}${metadataItem('Дата изменения','7 ноября 2026, 18:05')}${metadataItem('Теги','<span class="tag-list"><span class="tag">Фасад</span><span class="tag">Архитектура</span></span>')}${metadataItem('Автор / команда','<a class="person-link" href="#profile" data-action="profile"><span class="person-icon">IV</span>@ivan</a>')}</div></section>`:''}
</div><footer class="bottom-brand">Опубликовано через <a href="#app" data-action="app">PhotoBunker</a><span class="copyright">© 2026 PhotoBunker</span></footer></main>`}
function appPage(){return `${heading()}<main class="app-explain"><div class="app-icon">${logo}</div><h1>PhotoBunker всегда под рукой</h1><p>Снимайте, организуйте задания и делитесь файлами. Установить приложение можно прямо из браузера — без App Store и Google Play.</p><div class="install-choices" role="group" aria-label="Выберите устройство"><button class="selected" data-install="ios" aria-pressed="true">iPhone</button><button data-install="android" aria-pressed="false">Android</button><button data-install="desktop" aria-pressed="false">Компьютер</button></div><section class="install-guide"><h2 id="guide-title">Добавить на экран «Домой»</h2><ol id="guide-steps"><li>Откройте <a href="https://photobunker.mysite.net" target="_blank" rel="noopener noreferrer">https://photobunker.mysite.net</a> <strong>именно в Safari</strong> на iPhone.</li><li>Нажмите «Поделиться» (или сначала меню страницы, затем «Поделиться») и выберите «На экран „Домой“».</li><li>Убедитесь, что переключатель <strong>«Открыть как веб-приложение» включён</strong>.</li><li>Нажмите «Добавить». Значок PhotoBunker появится на главном экране.</li></ol><p class="install-tip" id="guide-note">На iPhone используйте Safari: так вы сможете добавить PhotoBunker на экран «Домой» как отдельное приложение.</p></section><button class="back-to-file" data-action="card">Вернуться к файлу</button></main>`}
function render(){const main=$('#site');const prev=main.scrollTop;$('#root').innerHTML=state.route==='app'?appPage():card();main.scrollTop=state.route==='app'?0:prev;setMapZoom();}
function activateMap(){const holder=$('.map-shell');if(!holder)return;holder.querySelector('.map-svg')?.remove();holder.querySelector('.map-overlay')?.remove();holder.querySelector('.map-tools')?.remove();holder.querySelector('.map-activate')?.remove();const frame=document.createElement('iframe');frame.title='Интерактивная карта местоположения';frame.loading='lazy';frame.referrerPolicy='no-referrer';frame.src='https://www.openstreetmap.org/export/embed.html?bbox=41.632%2C41.644%2C41.642%2C41.652&layer=mapnik&marker=41.64781%2C41.63692';holder.prepend(frame)}
function setMapZoom(){const map=$('#map-art');if(map)map.style.setProperty('--map-scale',state.mapZoom)}
async function copy(text){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);notify('Скопировано');return}}catch{}const hidden=document.createElement('textarea');hidden.value=text;hidden.style.position='fixed';hidden.style.opacity='0';document.body.appendChild(hidden);hidden.focus();hidden.select();const ok=document.execCommand?.('copy');hidden.remove();if(ok)notify('Скопировано');else notify('Не удалось скопировать ссылку')}
async function download(){try{const el=$('#safe-photo');if(!el){notify('Файл недоступен');return}const svg=el.cloneNode(true);svg.removeAttribute('id');const value=new XMLSerializer().serializeToString(svg);const blob=new Blob([value],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const image=new Image();image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=850;canvas.height=565;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,850,565);canvas.toBlob(async file=>{URL.revokeObjectURL(url);if(!file){notify('Не удалось подготовить файл');return}const png=new File([file],'SITE0001-safe.png',{type:'image/png'});try{if(navigator.share&&navigator.canShare?.({files:[png]})){await navigator.share({files:[png],title:'Фасад западного корпуса'});return}}catch(e){if(e?.name==='AbortError')return}const link=document.createElement('a');const object=URL.createObjectURL(png);link.href=object;link.download=png.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(object),1000);notify('Файл подготовлен')},'image/png') }catch{URL.revokeObjectURL(url);notify('Не удалось подготовить файл')}};image.onerror=()=>{URL.revokeObjectURL(url);notify('Не удалось подготовить файл')};image.src=url}catch{notify('Не удалось подготовить файл')}}
async function share(){try{if(navigator.share){await navigator.share({title:'Фасад западного корпуса · PhotoBunker',url:safeLink});return}}catch(e){if(e?.name==='AbortError')return}await copy(safeLink)}
function setupInstall(which){const url='<a href="https://photobunker.mysite.net" target="_blank" rel="noopener noreferrer">https://photobunker.mysite.net</a>';const settings={
 ios:{title:'Добавить на экран «Домой»',steps:[`Откройте ${url} <strong>именно в Safari</strong> на iPhone.`,`Нажмите «Поделиться» (при необходимости сначала откройте меню страницы) и выберите «На экран „Домой“».`,`Убедитесь, что переключатель <strong>«Открыть как веб-приложение» включён</strong>.`,`Нажмите «Добавить». PhotoBunker появится на главном экране.`],note:'На iPhone используйте Safari: так вы сможете добавить PhotoBunker на экран «Домой» как отдельное приложение.'},
 android:{title:'Установить на Android',steps:[`Откройте ${url} в <strong>Google Chrome</strong>.`,`Нажмите меню <strong>⋮</strong> справа вверху и выберите «Установить приложение» или «Добавить на главный экран».`,`Нажмите «Установить» или «Добавить» и следуйте подсказкам.`,`Открывайте PhotoBunker с нового значка на главном экране.`],note:'Название пункта меню зависит от версии Chrome и того, поддерживает ли сайт установку как приложение.'},
 desktop:{title:'Установить на компьютер',steps:[`Откройте ${url} в <strong>Google Chrome</strong>.`,`Нажмите значок установки справа в адресной строке. Если его нет — откройте меню ⋮ и найдите «Установить страницу как приложение».`,`Подтвердите установку, после чего запускайте PhotoBunker из списка приложений.`],note:'Для установки требуется работающая веб-версия PhotoBunker, поддерживающая PWA.'}
 };const d=settings[which];$$('[data-install]').forEach(b=>{b.classList.toggle('selected',b.dataset.install===which);b.setAttribute('aria-pressed',String(b.dataset.install===which))});$('#guide-title').textContent=d.title;$('#guide-steps').innerHTML=d.steps.map(x=>`<li>${x}</li>`).join('');$('#guide-note').textContent=d.note;}
function changeRoute(which){if(which==='profile'){notify('Карточка пользователя откроется по разрешённой ссылке');return}state.route=which;history.replaceState(null,'',which==='app'?'#install':'#card');render();$('#site').scrollTop=0}
document.addEventListener('click',async e=>{const size=e.target.closest('[data-device]');if(size){$('#device').className='device '+size.dataset.device;$$('[data-device]').forEach(b=>{b.classList.toggle('selected',b===size);b.setAttribute('aria-pressed',String(b===size))});return}const platform=e.target.closest('[data-install]');if(platform){setupInstall(platform.dataset.install);return}const a=e.target.closest('[data-action]');if(!a)return;const name=a.dataset.action;e.preventDefault();if(name==='card'||name==='app'||name==='profile'){changeRoute(name);return}if(name==='zoom'){$('#lightbox-photo').innerHTML=photo;$('#lightbox').hidden=false;return}if(name==='copy'){await copy(safeLink);return}if(name==='copy-gps'){await copy('41.64781, 41.63692');return}if(name==='download'){await download();return}if(name==='share'){await share();return}if(name==='map-live'){activateMap();return}if(name==='map-plus'||name==='map-minus'){state.mapZoom=Math.max(1,Math.min(2.25,state.mapZoom+(name==='map-plus'?.2:-.2)));setMapZoom();return}});
$('#close-lightbox').addEventListener('click',()=>$('#lightbox').hidden=true);$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').hidden=true});window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lightbox').hidden=true});$('#fixture').addEventListener('change',e=>{state.fixture=e.target.value;state.mapZoom=1;render();$('#site').scrollTop=0});window.addEventListener('hashchange',()=>{state.route=location.hash==='#install'?'app':'card';render()});state.route=location.hash==='#install'?'app':'card';render();
})();
</script></body></html>
