<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>PhotoBunker · Public Card 1.1</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="preview-bar"><span class="preview-label">FIELDWORK / PUBLIC CARD 1.1</span><div class="preview-actions"><select id="fixture" aria-label="Видимость карточки"><option value="full">Доступны данные и GPS</option><option value="restricted">Скрыты дополнительные поля</option><option value="viewOnly">Только просмотр, без скачивания</option><option value="expired">Срок действия истёк</option></select><div class="preview-switch" role="group" aria-label="Размер экрана"><button type="button" class="selected" data-device="phone" aria-pressed="true">Телефон</button><button type="button" data-device="desktop" aria-pressed="false">Desktop</button></div></div></div>
<div class="stage"><div class="device phone" id="device"><div class="site" id="site"><div id="root"></div><div class="lightbox" id="lightbox" hidden><button type="button" class="lightbox-close" id="close-lightbox" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></button><div id="lightbox-photo"></div></div><div class="toast" role="status" id="toast" hidden></div></div></div></div>
<div class="preview-note">В панели предпросмотра можно проверить отображение разрешённых полей, отсутствие права скачивания и истечение срока ссылки.</div>
<script src="app.js"></script></body></html>
