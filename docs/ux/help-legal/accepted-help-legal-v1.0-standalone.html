/* Fieldwork 1.1 — compact reusable person profile and unified presence settings. */
.profile-identity-header{display:flex;flex-direction:column;align-items:center;gap:11px;padding:0 0 16px;text-align:center}
.profile-identity-header .person-avatar.large{width:91px;height:91px;font-size:29px;border:3px solid #304437}
.profile-identity-header .profile-name{font-size:19px;line-height:1.2}
.identity-lines{border-top:1px solid #373737}
.identity-line{display:flex;align-items:center;gap:12px;border-bottom:1px solid #373737;padding:12px 0}
.identity-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.identity-text small{font-size:10px;color:#a0a0a0}
.identity-text strong{font-size:14px;letter-spacing:.015em;overflow-wrap:anywhere;font-weight:750}
.copy-icon-button{background:#333;border:0;border-radius:7px;width:39px;height:38px;display:grid;place-items:center;flex:none}
.copy-icon-button svg{width:17px;height:17px}
.copy-icon-button:hover{background:#434343}
.profile-unnamed{color:#9c9c9c;font-size:11px}
.presence-line{display:flex;align-items:center;gap:8px;margin-top:13px;color:#c9c9c9;font-size:11.5px}
.presence-dot{width:8px;height:8px;background:var(--green);border-radius:50%;flex:none}
.presence-dot.is-hidden{background:#777}
.presence-extra{color:#da9999}
.profile-main-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0 17px}
.profile-main-actions button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:43px;border-radius:7px;font-size:12px;font-weight:690;border:0;padding:10px 8px;white-space:nowrap}
.profile-main-actions button svg{width:17px;height:17px}
.profile-main-actions .primary-action{color:#142217;background:var(--green)}
.profile-main-actions .secondary-action{background:#373737}
.profile-main-actions button:disabled{opacity:.43;cursor:not-allowed}
.about-section{border-top:1px solid #373737;padding:17px 0 18px}
.about-section h2{font-size:13px;margin:0 0 8px;font-weight:750}
.about-section p{font-size:12px;color:#c9c9c9;line-height:1.65;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.about-section .profile-empty{color:#939393}
.profile-links{border-top:1px solid #373737;display:grid}
.profile-link{display:flex;gap:14px;align-items:center;text-align:left;min-height:58px;padding:12px 4px;border:0;border-bottom:1px solid #343844;background:none;font-size:13px;font-weight:500;color:#f0f1f4;letter-spacing:-.01em}
.profile-link:last-child{border-bottom:0}
.profile-link>svg{width:21px;height:21px;color:#bfc5d1;flex:none}
.profile-link span{flex:1}
.profile-link>svg:last-child{width:16px;height:16px;color:#8d95a5}
.profile-link:hover{color:#fff}.profile-link:hover>svg:last-child{color:#c6cedb}.profile-link:hover>svg:first-child{color:#d5dbe6}
.profile-link.danger{color:#f0b9b3}
.profile-link.danger>svg:first-child{color:#f0b9b3}
.tariff-demo{margin:10px 0 14px;display:flex;flex-wrap:wrap;gap:8px}.tariff-demo .plan-pill{margin-right:0}.tariff-caption{color:#9d9d9d;font-size:11px;margin:0 0 8px;padding:0 2px}
.readonly-id{position:relative;display:flex;flex-direction:column;gap:3px;background:#292929;border-radius:7px;padding:11px 49px 11px 13px;margin:0 0 15px}
.readonly-id>span{font-size:11px;color:#9f9f9f}
.readonly-id strong{font-size:13px}
.readonly-id button{position:absolute;right:8px;top:calc(50% - 17px);height:34px;width:34px;border:0;background:#3b3b3b;border-radius:6px;display:grid;place-items:center}
.readonly-id button svg{width:16px;height:16px}
.form-card+.section-title{margin-top:24px}


/* Fieldwork 1.2: identity is free-standing; the three content sections are separate blocks. */
.header-actions .plan-pill{width:auto;min-width:162px;min-height:31px;margin-right:8px;padding:0 12px;display:flex;align-items:center;justify-content:center;background:#353535;border:1px solid #444;color:#ececec;border-radius:10px;font-size:11px;font-weight:750;letter-spacing:0;white-space:nowrap}
.plan-pill[data-plan='free']{background:#3b3b3b;border-color:#4a4a4a;color:#ededed}
.plan-pill[data-plan='pro-ok']{background:#23432a;border-color:#3f8750;color:#d5f2da}
.plan-pill[data-plan='pro-expiring']{background:#472222;border-color:#a34848;color:#ffd0d0}
.header-actions .plan-pill:hover{filter:brightness(1.06)}
.profile-top-clean{display:flex;flex-direction:column;align-items:center;text-align:center;padding:11px 0 17px;background:transparent}
.profile-top-clean .person-avatar.large{width:102px;height:102px;min-width:102px;font-size:36px;border:0;background:#33483c;box-shadow:0 0 0 1px #3f5847}
.profile-center-username{display:flex;align-items:center;justify-content:center;gap:5px;max-width:100%;margin-top:16px;color:#f5f5f5}
.profile-center-username strong{font-size:26px;line-height:1.2;letter-spacing:-.055em;font-weight:800;overflow-wrap:anywhere;min-width:0}
.profile-center-id{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px;color:#9e9e9e;font-size:12px;letter-spacing:.025em}
.identity-copy{display:inline-grid;place-items:center;flex:none;background:transparent;border:0;color:#a2a2a2;border-radius:5px;padding:3px;width:25px;height:25px}
.identity-copy svg{width:15px;height:15px}
.profile-center-id .identity-copy{width:22px;height:22px;padding:4px;color:#8c8c8c}
.profile-center-id .identity-copy svg{width:13px;height:13px}
.identity-copy:hover{color:#fff;background:#303030}
.profile-center-presence{display:flex;align-items:center;justify-content:center;gap:7px;color:#b8b8b8;font-size:11.5px;margin-top:7px}

  {group:'Помощь и PhotoBunker',items:[['about','О приложении','Принципы, безопасность, назначение','shield'],['faq','Частые вопросы','Шифрование, задания, бэкапы, защита','help'],['support','Помощь','Как разобраться с проблемой и подготовить обращение','message']]},

const features=[
['shield','Zero-Knowledge · шифрование на устройстве','Мы строим архитектуру, в которой материалы шифруются на устройстве до отправки в облако. Сервер должен хранить зашифрованные данные, а не ключи для их просмотра. Это архитектурная цель, которую необходимо подтвердить аудитом.'],
['lock','Защита от изъятия · Emergency PIN','Экстренный PIN предназначен для быстрого прекращения локального доступа и уничтожения локальных ключей доступа. Удалённые операции требуют подтверждения сервером. Автоматический Dead Man’s Switch — возможная будущая функция, не доступная сейчас.'],
['database','Изоляция от ОС · Anti-Forensics','Приложение не должно автоматически сохранять материалы в системную фотогалерею или создавать незашифрованные пользовательские миниатюры и индексы. При этом невозможно гарантировать отсутствие любых временных следов, созданных самой ОС или браузером.'],

['check','Простота и надёжность','Сначала действие, затем всё остальное: понятный интерфейс, быстрая съёмка, локальная работа при плохой сети и ясное состояние синхронизации. Приватность без сложных ритуалов.']
];
const faqs=[
 {group:'Начало работы',items:[
 ['Для чего нужен PhotoBunker?','PhotoBunker помогает организовать задания, работу команд и создание материалов — фото, видео и аудио — с повышенным контролем над доступом и сроком хранения. Это не классический облачный диск.'],
 ['Как работают задания и команды?','В задании задаются инструкции, участники, требования к материалам и срок хранения. Команды объединяют людей и их роли. Доступ к материалам должен зависеть от конкретных разрешений, а не от одного факта участия.'],
 ['Можно ли снимать без интернета?','Целевая модель — Local-First: материал сначала безопасно сохраняется на устройстве в зашифрованном виде, а затем синхронизируется в облако. До подтверждения загрузки приложение должно честно показывать, что единственная копия ещё локальная.']
 ]},
 {group:'Конфиденциальность',items:[
 ['Что означает Zero-Knowledge?','Целевая архитектура предполагает шифрование материалов на устройстве до их передачи серверу. Облачный сервер не должен получать ключи для чтения содержимого. Пока не завершены проверки протоколов и реализации, это принцип проектирования, а не независимая сертификация.'],
 ['Попадают ли фотографии в системную галерею?','PhotoBunker не должен автоматически сохранять отснятые материалы в обычную фототеку. Ручной экспорт за пределы приложения меняет ситуацию: скопированный файл может оказаться в других приложениях или резервных копиях устройства.'],
 ['Могут ли в системе остаться следы?','Нельзя достоверно гарантировать отсутствие всех кэшей, временных буферов, системных снимков экрана и следов на взломанном устройстве. Наша задача — не создавать собственных незашифрованных файлов и миниатюр и минимизировать остаточные данные.'],
 ['Кто может просматривать мои файлы?','Только аккаунты с соответствующими правами должны получать возможность расшифрования конкретных материалов. Безопасность зависит от реализации E2EE, ключей, ролей и проверки доступа; её нельзя гарантировать одним описанием продукта.'],
 ['Что делает экстренный PIN?','Он предназначен для немедленной блокировки и уничтожения локального доступа. Удаление на сервере не может считаться выполненным, пока сервер не подтвердил запрос. На платных планах восстановление возможно только при наличии доступного зашифрованного бэкапа и ключа.'],
 ['Есть ли Dead Man’s Switch?','Пока нет. Автоматический сценарий при длительном отсутствии активности обсуждается как будущая возможность. Действующий экстренный PIN — другой механизм: он требует явного действия пользователя.'],
 ['Что произойдёт, если я потеряю ключ восстановления?','При отсутствии ключа и доверенных устройств доступ к зашифрованным данным может быть безвозвратно потерян. Даже наличие резервной копии само по себе не заменяет ключ для расшифрования.']
 ]},
 {group:'Хранение и тарифы',items:[
 ['Как работает резервная копия?','Это одна логическая зашифрованная копия, которая обновляется с частотой, разрешённой тарифом. Каждое обновление не означает создание нового вечного архива. Free не включает бэкап.'],
 ['Что будет, если закончится тариф?','У платных планов предусмотрен льготный период 15–60 дней в зависимости от плана. В аккаунте должны отображаться конкретные применимые сроки. При этом собственный TTL материала или правила задания действуют независимо от срока подписки.'],
 ['Зачем лимиты объёма, если PhotoBunker не облачный диск?','Оплата относится к заданиям и инструментам работы. Объём и количество файлов — технические ограничения, которые не позволяют одному аккаунту занимать чрезмерные ресурсы. У Unlimited нет лимита по количеству файлов, но объём облака ограничен 1 ТБ.'],
 ['Можно ли подключить собственный S3?','В текущие тарифы эта возможность не включена. Архитектура может поддержать дополнительные хранилища в будущем, но сейчас это не обещанная функция.']
 ]}

const state={route:'info',searchOpen:false,searchText:'',supportText:'',supportTopic:'Вопрос о функциях',supportPrepared:false,faqText:'',depth:0};
let toastTimer;

function infoHub(){return `<div class="info-wrap">${heading('Помощь и информация','PhotoBunker · руководство и документы',true)}<p class="info-intro">Всё необходимое, чтобы разобраться в работе приложения и его принципах защиты — без лишних меню.</p>${sections.map(s=>`<section class="info-section"><h2>${esc(s.group)}</h2><div class="settings-list">${s.items.map(row).join('')}</div></section>`).join('')}<p class="info-note">Условия использования и Политика конфиденциальности сейчас содержат только демонстрационный текст и не предназначены для публикации.</p></div>`}
function about(){return `<div class="info-wrap">${heading('О PhotoBunker','Privacy by design · Safety Tech')}<div class="info-hero"><span class="hero-emblem">${icon('shield')}</span><strong>Создавайте материалы. Контролируйте доступ.</strong><p>PhotoBunker — инструмент для заданий и команд, где фото, видео и аудио должны оставаться под контролем владельца. Мы стремимся соединить удобство обычной камеры с принципами защищённого хранилища.</p></div><section class="info-section"><h2>Наши принципы</h2><div class="feature-list">${features.map(([k,h,t])=>`<div class="feature-item"><span class="feature-icon">${icon(k)}</span><div><h3>${esc(h)}</h3><p>${esc(t)}</p></div></div>`).join('')}</div></section><div class="about-footer"><p><strong>Принцип, а не рекламное обещание.</strong> Возможности защиты должны подтверждаться тестами, аудитом и проверкой на реальных устройствах. Абсолютную незаметность или невозможность восстановления следов ОС никто не может гарантировать.</p></div><div class="info-actions"><button type="button" class="medium-button" data-action="navigate" data-route="faq">Частые вопросы</button><button type="button" class="medium-button primary" data-action="navigate" data-route="support">Помощь</button></div></div>`}
function faq(){const num=faqs.reduce((n,g)=>n+g.items.length,0);return `<div class="info-wrap">${heading('Частые вопросы',`${num} ответов · поиск по FAQ`)}<div class="faq-search">${icon('search')}<input type="search" id="faq-query" placeholder="Найти ответ" autocomplete="off" aria-label="Поиск по вопросам" value="${esc(state.faqText)}"></div><p class="faq-count" id="faq-count">Показаны все вопросы</p>${faqs.map((g,i)=>`<section class="faq-group" data-faq-group><h2>${esc(g.group)}</h2><div class="faq-items">${g.items.map(([q,a])=>`<details class="faq-item" data-search="${esc((q+' '+a).toLowerCase())}"><summary><span>${esc(q)}</span><span class="faq-arrow">${icon('chevron')}</span></summary><div class="faq-answer"><p>${esc(a)}</p></div></details>`).join('')}</div></section>`).join('')}<div class="faq-empty" id="faq-empty" hidden>Ничего не найдено. Измени запрос или открой раздел «Помощь».</div><div class="info-actions"><button class="medium-button" type="button" data-action="navigate" data-route="info">Все разделы</button><button class="medium-button primary" type="button" data-action="navigate" data-route="support">Помощь</button></div></div>`}
function help(){return `<div class="info-wrap">${heading('Помощь','Разобраться, найти ответ, подготовить обращение')}<section class="help-panel"><h2>Сначала проверь FAQ</h2><p>Вопросы о ключах, резервных копиях, экстренном PIN, сроках хранения и заданиях собраны в одном месте.</p><button type="button" class="medium-button" data-action="navigate" data-route="faq">Перейти к FAQ</button></section><section class="info-section"><h2>Подготовить сообщение в поддержку</h2><div class="help-panel"><p>Пока у прототипа нет реального канала поддержки. Составь текст обращения и скопируй его — отправка из этой страницы не выполняется.</p><form id="help-form"><div class="help-field"><label for="topic">Тема</label><select id="topic" name="topic"><option>Вопрос о функциях</option><option>Проблема с аккаунтом или ключом</option><option>Ошибка приложения</option><option>Задания и команды</option><option>Тарифы и платежи</option><option>Безопасность и приватность</option></select></div><div class="help-field"><label for="help-text">Описание</label><textarea id="help-text" name="help-text" placeholder="Опиши, что произошло и на каком экране. Не отправляй PIN, Recovery Key или приватные материалы." maxlength="2000" required>${esc(state.supportText)}</textarea><small>Не прикладывай пароли, ключи и личные документы.</small></div><p id="help-error" class="help-error" role="alert"></p><button class="medium-button primary" type="submit">Подготовить текст обращения</button></form><div class="help-status" id="help-output" hidden><strong>Текст готов, но никуда не отправлен.</strong><p id="help-preview" style="white-space:pre-wrap;margin:9px 0;font-size:11px"></p><button type="button" class="medium-button" data-action="copy-support">Скопировать текст</button></div></div></section></div>`}
function legalHub(){return `<div class="info-wrap">${heading('Условия и политика','Временные материалы — юридические тексты не утверждены')}<p class="info-intro">Перед публичным запуском здесь будут полные условия использования, правила обработки данных и прозрачные ограничения ответственности.</p><section class="info-section"><div class="settings-list">${row(['terms','Условия использования','Черновая заглушка','file'])}${row(['privacy','Политика конфиденциальности','Черновая заглушка','lock'])}</div></section></div>`}
function terms(){return `<div class="info-wrap">${heading('Условия использования')}<div class="legal-draft"><span class="legal-label">Текст-заглушка · не юридический документ</span><strong>Условия использования PhotoBunker</strong><p>Сервис предоставляется «как есть». Мы не несём ответственности ни за что — это намеренно упрощённая временная фраза, не имеющая силы публичного соглашения.</p><p>Настоящие условия с корректными обязанностями сторон, правилами оплаты и ограничениями ответственности будут опубликованы до запуска.</p></div><button type="button" class="info-mini-link info-return" data-action="navigate" data-route="privacy">Политика конфиденциальности</button></div>`}
function privacy(){return `<div class="info-wrap">${heading('Политика конфиденциальности')}<div class="legal-draft"><span class="legal-label">Текст-заглушка · не юридический документ</span><strong>Принципы конфиденциальности</strong><p>Наша цель — не получать доступа к содержимому твоих зашифрованных материалов. Но абсолютную защиту от всех угроз, ошибок устройства или действий ОС мы не обещаем.</p><p>Политика с реальным перечнем собираемых данных, сроками хранения и правами пользователя будет подготовлена до публичного запуска.</p></div><button type="button" class="info-mini-link info-return" data-action="navigate" data-route="terms">Условия использования</button></div>`}
const searchTargets=[...sections.flatMap(g=>g.items.map(([route,title,desc])=>({route,title,desc}))),...faqs.flatMap(g=>g.items.map(([title,desc])=>({route:'faq',title,desc})))];
function searchPage(){const q=state.searchText.trim().toLowerCase();const items=q?searchTargets.filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q)):searchTargets.slice(0,5);return `<div class="info-wrap">${heading('Поиск по справке','About, FAQ, Help, документы')}<section class="settings-list">${items.length?items.map(x=>`<button class="info-search-item" type="button" data-action="navigate" data-route="${x.route}">${icon('search')}<span><strong>${esc(x.title)}</strong><small>${esc(x.desc.slice(0,94))}</small></span>${icon('chevron')}</button>`).join(''):'<div class="faq-empty">Ничего не найдено. Попробуй другой запрос.</div>'}</section></div>`}
function settings(){return `<div class="info-wrap">${heading('Настройки','Экран перехода · только этап 3')}<section class="info-section"><h2>Информация</h2><div class="settings-list">${row(['info','Помощь, FAQ и О приложении','Информация о PhotoBunker','help'])}${row(['legal','Условия и политика','Условия использования и конфиденциальность','file'])}</div></section><p class="info-note">Остальные настройки согласованы в предыдущих прототипах и здесь не дублируются.</p></div>`}
function render(reset=true){const old=$('#main').scrollTop;const routes={'info':infoHub,'about':about,'faq':faq,'support':help,'legal':legalHub,'terms':terms,'privacy':privacy,'settings':settings};$('#content').innerHTML=state.searchOpen?searchPage():(routes[state.route]||infoHub)();$('#main').scrollTop=reset?0:old;$('#header-search').classList.toggle('active',state.searchOpen);$('#header-search').setAttribute('aria-expanded',String(state.searchOpen));if(state.route==='faq'&&!state.searchOpen)applyFaqFilter();if(state.route==='support'&&!state.searchOpen)$('#topic').value=state.supportTopic;}
function renderSearch(){$('#search-tray').hidden=!state.searchOpen;$('#header-search').innerHTML=icon('search');$('#search-icon').innerHTML=icon('search');$('#clear-search').innerHTML=icon('close');$('#clear-search').hidden=!state.searchText;$('#settings-query').value=state.searchText;render();}
function navigate(route){if(state.route===route&&!state.searchOpen)return;state.route=route;state.searchOpen=false;state.searchText='';state.depth++;history.pushState({route,depth:state.depth},'',`#${route}`);renderSearch();}
function back(){if(state.searchOpen){state.searchOpen=false;state.searchText='';renderSearch();return}if(state.depth>0){history.back();return}navigate(state.route==='info'?'settings':'info');}
function applyFaqFilter(){const q=state.faqText.trim().toLowerCase();let n=0;document.querySelectorAll('[data-faq-group]').forEach(g=>{let count=0;g.querySelectorAll('.faq-item').forEach(item=>{const show=!q||item.dataset.search.includes(q);item.hidden=!show;if(show){n++;count++}});g.hidden=count===0});$('#faq-empty').hidden=n!==0;$('#faq-count').textContent=q?`Найдено вопросов: ${n}`: 'Показаны все вопросы';}
function showSheet(title,desc){$('#overlay').hidden=false;$('#sheet-title').textContent=title;$('#sheet-close').innerHTML=icon('close');$('#sheet-body').innerHTML=`<p>${esc(desc)}</p><button type="button" class="sheet-button primary" data-action="close-sheet">Закрыть</button>`;}
async function copy(text){try{if(!navigator.clipboard)throw Error('unsupported');await navigator.clipboard.writeText(text);toast('Текст скопирован')}catch{const t=$('#help-text');if(t){t.focus();t.select();toast('Выделен текст — скопируй вручную')}else toast('Скопируй текст вручную')}}
function handle(e){const el=e.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){
case 'navigate':navigate(el.dataset.route);break;
case 'back':back();break;
case 'toggle-search':state.searchOpen=!state.searchOpen;state.searchText='';renderSearch();if(state.searchOpen)$('#settings-query').focus();break;
case 'close-search':state.searchOpen=false;state.searchText='';renderSearch();break;
case 'clear-search':state.searchText='';$('#settings-query').value='';$('#clear-search').hidden=true;render(false);$('#settings-query').focus();break;
case 'status':showSheet('Статус приложения','Это демонстрация общей оболочки. Реальные операции здесь не отслеживаются.');break;
case 'current-plan':showSheet('Тариф: Unlimited (267 дней)','Это демо-данные, экран тарифа уже утверждён в отдельном UX-прототипе.');break;
case 'copy-support':copy(`Тема: ${state.supportTopic}\n\n${state.supportText}`);break;
case 'close-sheet':$('#overlay').hidden=true;break;
case 'dock':showSheet(el.dataset.name,'Остальные разделы PhotoBunker доступны в других UX-прототипах.');break;
}}
$('#app').addEventListener('click',handle);
$('#app').addEventListener('input',e=>{if(e.target.id==='settings-query'){state.searchText=e.target.value;$('#clear-search').hidden=!state.searchText;render(false)}else if(e.target.id==='faq-query'){state.faqText=e.target.value;applyFaqFilter()}else if(e.target.id==='help-text'){state.supportText=e.target.value;const out=$('#help-output');if(out)out.hidden=true}});
$('#app').addEventListener('change',e=>{if(e.target.id==='topic')state.supportTopic=e.target.value});
$('#app').addEventListener('submit',e=>{if(e.target.id!=='help-form')return;e.preventDefault();const val=$('#help-text').value.trim();$('#help-error').textContent='';if(val.length<15){$('#help-error').textContent='Напиши хотя бы 15 символов, чтобы обращение было понятным.';return}state.supportText=val;state.supportTopic=$('#topic').value;$('#help-preview').textContent='Тема: '+state.supportTopic+'\n\n'+val;$('#help-output').hidden=false;$('#help-output').scrollIntoView({block:'nearest',behavior:'smooth'});});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')$('#overlay').hidden=true});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden)$('#overlay').hidden=true;else if(state.searchOpen){state.searchOpen=false;state.searchText='';renderSearch()}}});
window.addEventListener('popstate',()=>{state.route=(history.state?.route)||'info';state.depth=history.state?.depth||0;state.searchOpen=false;state.searchText='';renderSearch()});
document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-device]').forEach(v=>{v.classList.toggle('selected',v===b);v.setAttribute('aria-pressed',String(v===b))});$('#device').className='device '+b.dataset.device}));
dock();const initial=decodeURIComponent(location.hash.slice(1));state.route=['info','about','faq','support','legal','terms','privacy','settings'].includes(initial)?initial:'info';history.replaceState({route:state.route,depth:0},'',`#${state.route}`);renderSearch();
})();
</script>
</body>
</html>
