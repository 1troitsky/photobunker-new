/* Data & Storage 1.1: additions to the established Fieldwork shell. */
.quota-block+.quota-block{border-top:1px solid #363636;margin-top:17px;padding-top:17px}
.quota-metric{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.quota-metric strong{font-size:19px;font-weight:780;letter-spacing:-.035em}
.quota-metric span{font-size:11px;color:#aaa}
.quota-note{font-size:11px;color:#a3a3a3;margin:5px 0 0}
.queue-summary{padding-top:13px;margin-top:16px;border-top:1px solid #363636}
.queue-amount{font-size:13px;font-weight:720;color:#f1f1f1}
.queue-footnote{color:#aaa;font-size:11px;margin:6px 0 0;line-height:1.5}
.queue-file{display:flex;align-items:center;gap:12px;padding:14px 15px;min-width:0;border-bottom:1px solid #363636}
.queue-file:last-child{border-bottom:0}
.queue-file>.file-ico{color:#b9b9b9;flex:none}
.queue-file>.file-ico svg{height:21px;width:21px}
.queue-file .file-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.queue-file .file-text strong{font-size:12px;font-weight:690;overflow-wrap:anywhere}
.queue-file .file-text small{font-size:10.5px;color:#aaa}
.queue-file .action{flex:none;font-size:11px;padding:7px 9px;min-height:32px}
.backup-list{display:grid}
.backup-list button:last-child{border-bottom:0}
.backup-status{color:#9de4b0;font-weight:670}
.backup-detail-heading{font-size:13px;font-weight:730;margin:0 0 5px}
.weekday-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 8px}
.weekday{height:37px;border:1px solid #505050;border-radius:8px;background:#303030;color:#dedede;font-size:11px;font-weight:670;min-width:0;padding:0}
.weekday[aria-pressed="true"]{background:#1d753b;border-color:#2f9e50;color:#fff}
.weekday:hover{border-color:#a4a4a4}
.weekday:focus-visible{outline:2px solid #a2eab7;outline-offset:2px}
.cache-usage{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:16px}
.cache-usage strong{font-size:20px;font-weight:770;letter-spacing:-.035em}
.cache-usage .action{flex:none;margin-left:auto}
.cache-range{width:100%;height:26px;accent-color:var(--green);margin:12px 0 0;cursor:pointer}
.cache-range:focus-visible{outline:2px solid #a2eab7;outline-offset:2px}
.range-labels{display:flex;justify-content:space-between;gap:7px;color:#aaa;font-size:10.5px;margin-top:5px}
.range-labels span:nth-child(2){text-align:center}
.range-labels span:last-child{text-align:right}
@media(max-width:360px){.queue-file{gap:8px;padding:12px 11px}.queue-file .action{font-size:10px;padding:6px 8px}.weekday-row{gap:4px}.weekday{height:34px}}

function timer(){if(state.view!=='welcome'||document.hidden||state.paused||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;if(Date.now()-lastTick>=5500){next();resetIdle()}}
setInterval(timer,250);
let swipeStart=null;document.addEventListener('touchstart',e=>{if(e.target.closest('#carousel')){swipeStart=e.changedTouches[0].clientX;state.paused=true}},{passive:true});
document.addEventListener('touchend',e=>{if(swipeStart===null)return;const delta=e.changedTouches[0].clientX-swipeStart;if(Math.abs(delta)>40){state.slide=(state.slide+(delta<0?1:-1)+features[state.locale].length)%features[state.locale].length;drawSlide(true)}swipeStart=null;state.paused=false;resetIdle()},{passive:true});
document.addEventListener('mouseover',e=>{if(e.target.closest('#carousel'))state.paused=true});
document.addEventListener('mouseout',e=>{if(e.target.closest('#carousel')){state.paused=false;resetIdle()}});
document.addEventListener('focusin',e=>{if(e.target.closest('#carousel'))state.paused=true});
document.addEventListener('focusout',e=>{if(e.target.closest('#carousel')){state.paused=false;resetIdle()}});
document.addEventListener('click',async e=>{const slideButton=e.target.closest('[data-slide]');if(slideButton){e.preventDefault();state.slide=Number(slideButton.dataset.slide);drawSlide(true);slideButton.blur();state.paused=false;resetIdle();return;}const welcomeLink=e.target.closest('a.welcome-link');if(welcomeLink){e.preventDefault();navigateAnimated(welcomeLink.hash.slice(1));return;}const preview=e.target.closest('[data-preview-state]');if(preview){state.previewLoading=preview.dataset.previewState==='loading';document.querySelectorAll('[data-preview-state]').forEach(b=>{b.classList.toggle('selected',b===preview);b.setAttribute('aria-pressed',String(b===preview))});const slot=$('#welcome-auth-slot');if(slot)slot.innerHTML=welcomeAuthSlot();return;}const mode=e.target.closest('[data-device]');if(mode){$('#device').className='device '+mode.dataset.device;document.querySelectorAll('[data-device]').forEach(b=>{b.classList.toggle('selected',b===mode);b.setAttribute('aria-pressed',String(b===mode))});return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;e.preventDefault();switch(a){case 'home':navigateAnimated('welcome');break;case 'search':showSheet('Поиск',`<p>Поиск настроек доступен после входа в аккаунт.</p><button class="action" data-action="close-sheet">Закрыть</button>`);break;case 'tariff':case 'bell':case 'status':case 'dock':showSheet('PhotoBunker',`<p>Этот раздел доступен после входа в аккаунт.</p><button class="action" data-action="close-sheet">Закрыть</button>`);break;case 'close-sheet':closeSheet();break;case 'generate':{const parts=[];const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const bytes=new Uint8Array(40);crypto.getRandomValues(bytes);for(let i=0;i<40;i++)parts.push(alphabet[bytes[i]%alphabet.length]);state.generated=parts.join('').match(/.{1,8}/g).join('-');state.ack=false;render();break}case 'copy-key':try{await navigator.clipboard.writeText(state.generated);toast('Ключ скопирован')}catch{const a=$('#generated-key');a?.select();toast('Выделите текст и скопируйте ключ')}break;case 'save-key':{const f=new File([state.generated],'photobunker-recovery-key.txt',{type:'text/plain'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'PhotoBunker Recovery Key'});break}if(window.showSaveFilePicker){const h=await window.showSaveFilePicker({suggestedName:'photobunker-recovery-key.txt',types:[{description:'Текст',accept:{'text/plain':['.txt']}}]});const w=await h.createWritable();await w.write(state.generated);await w.close();break}toast('Скопируйте ключ и сохраните в удобном месте')}catch(err){if(err.name!=='AbortError')toast('Не удалось сохранить ключ')}break}case 'finish-auth':toast(state.ack?'Ключ сохранён для следующего шага':'Сначала сохраните ключ');break;case 'recover-submit':toast($('#recovery-key').value.trim()?'Ключ готов к проверке':'Введите Recovery Key');break;}});
document.addEventListener('change',async e=>{if(e.target.id==='ack-key'){state.ack=e.target.checked;document.querySelector('[data-action="finish-auth"]').disabled=!state.ack}if(e.target.id==='recovery-file'){const f=e.target.files?.[0];if(f&&f.size<=8192){const value=await f.text();state.authKey=value;$('#recovery-key').value=value}}});
window.addEventListener('hashchange',route);
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
route();
})();
</script></body></html>
