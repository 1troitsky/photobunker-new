{id:'t2',name:'Репортаж',description:'Материалы с выездных съёмок',owner:'p3',members:[{id:'p3',role:'owner',scope:'all',status:'accepted'},{id:'p5',role:'contributor',scope:'default',status:'accepted'},{id:'p1',role:'curator',scope:'all',status:'invited'}],assignments:[{name:'Городская прогулка',state:'Активное'}],editable:false},
{id:'t3',name:'Студия',description:'Команда для внутренних материалов',owner:'me',members:[{id:'p3',role:'curator',scope:'all',status:'accepted'},{id:'p5',role:'contributor',scope:'default',status:'accepted'}],assignments:[],editable:true}
];
const roleLabel={owner:'Владелец',curator:'Куратор',contributor:'Исполнитель',viewer:'Наблюдатель'};
const scopeLabel={default:'По правилам задания',none:'Без доступа',thumbnails:'Только предпросмотр',all:'Полный доступ'};
let memberOrigin='form',tab='teams',page='list',currentTeam='',search='',directorySearch='',sheet='',sheetData=null,draft=null,teamCounter=4,toastTimer=null,focusBack=null,focusSearch=false;
const person=id=>persons.find(x=>x.id===id),team=id=>teams.find(x=>x.id===id);
const handle=p=>p.username?'@'+p.username:'#'+p.uid;
const personHTML=(p,extra='')=>`<span class="person-avatar ${p.color}">${esc(p.avatar)}</span><span class="person-text"><strong>${esc(handle(p))}</strong>${extra?`<small>${esc(extra)}</small>`:''}</span>`;
const memberMini=id=>{const p=person(id);return p?`<span class="mini-avatar ${p.color}" title="${esc(handle(p))}">${esc(p.avatar)}</span>`:'<span class="mini-avatar avatar-gray">Вы</span>';};
const memberRow=(m,buttons='')=>{const p=person(m.id);if(!p)return '';return `<div class="team-member">${personHTML(p,m.status==='invited'?'Приглашён · '+roleLabel[m.role]:roleLabel[m.role])}<span class="role-tag ${m.role==='viewer'?'muted':''}">${esc(roleLabel[m.role])}</span>${buttons}</div>`};
const button=(action,label,cl='')=>`<button type="button" class="sheet-button ${cl}" data-action="${action}">${label}</button>`;
function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},2600)}
function renderDock(){const items=[['list','Задания'],['folder','Browser'],['camera','Камера'],['users','Контакты'],['user','Профиль']];$('#dock').innerHTML=items.map(([k,label])=>`<button type="button" class="${label==='Контакты'?'active':''}" data-action="dock" data-label="${label}">${icon(k)}<small>${label}</small></button>`).join('')}
function updateHeader(){
  const blacklist=$('#blacklist-head');
  blacklist.innerHTML=icon('ban');
  blacklist.setAttribute('aria-pressed',String(page==='blacklist'));
  blacklist.title='Blacklist';
}
function pageHeader(title,subtitle){return `<div class="page-heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div></div>`}
function contactCount(){return persons.filter(p=>p.contact&&!p.blocked).length;}
function topNav(){return `<nav class="main-tabs" role="tablist" aria-label="Контакты и Команды"><button type="button" role="tab" class="${tab==='teams'?'active':''}" data-action="tab" data-tab="teams" aria-selected="${tab==='teams'}">Команды (${teams.length})</button><button type="button" role="tab" class="${tab==='contacts'?'active':''}" data-action="tab" data-tab="contacts" aria-selected="${tab==='contacts'}">Контакты (${contactCount()})</button></nav>`}
function startTeam(){draft={id:'',name:'',description:'',members:[]};openSheet('Новая команда','team-form')}
function listTeams(){return pageHeader('Контакты и Команды','')+topNav()+`<button type="button" class="create-team-button" data-action="create-team">${icon('plus')} Создать команду</button><div class="item-list team-grid">${teams.map(t=>`<article class="team-card"><button class="item-main" data-action="team-open" data-id="${t.id}"><strong>${esc(t.name)}</strong><small>${esc(t.description)}</small><span class="item-sub"><span class="mini-stack">${(t.owner==='me'?['me']:[]).concat(t.members.map(m=>m.id)).slice(0,4).map(memberMini).join('')}</span><span>${t.members.length+(t.owner==='me'?1:0)} участников</span></span></button><button type="button" class="icon-more" data-action="team-menu" data-id="${t.id}" aria-label="Действия с командой ${esc(t.name)}">${icon('more')}</button></article>`).join('')}</div>`;}
function contactListRows(items){return items.map(p=>`<button type="button" class="person-row" data-action="profile" data-id="${p.id}">${personHTML(p,p.name&&p.username?'#'+p.uid:p.name)}<span class="row-end">${icon('chevron')}</span></button>`).join('')||'<div class="empty-state">Ничего не найдено</div>';}
function listContacts(){const q=search.trim().toLowerCase().replace(/^[@#]/,'');const saved=persons.filter(p=>p.contact&&!p.blocked).filter(p=>[p.username,p.name,p.uid].some(v=>String(v).toLowerCase().includes(q)));const found=directorySearch?persons.find(p=>('@'+p.username).toLowerCase()===directorySearch.toLowerCase()||('#'+p.uid)===directorySearch||p.uid===directorySearch):null;
return pageHeader('Контакты и Команды','')+topNav()+`<form class="search-box" id="search-form"><input name="contactSearch" id="contact-query" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="Поиск по @username или #ID" value="${esc(search)}" aria-label="Поиск по контактам или ID">${icon('search')}</form>${found&&!found.contact&&!found.blocked?`<section class="search-result"><small>Найден пользователь</small><button type="button" class="person-row" data-action="profile" data-id="${found.id}">${personHTML(found,found.name||'Профиль')}${icon('chevron')}</button><button type="button" class="add-contact" data-action="add-contact" data-id="${found.id}">Добавить в контакты</button></section>`:''}<div class="item-list" id="contacts-list">${contactListRows(saved)}</div>`;}
function listBlacklist(){const q=search.trim().toLowerCase().replace(/^[@#]/,'');const blocked=persons.filter(p=>p.blocked).filter(p=>[p.username,p.name,p.uid].some(v=>String(v).toLowerCase().includes(q)));return pageHeader('Контакты и Команды','')+`<div class="team-detail-title"><button type="button" class="back-link" data-action="blacklist-back" aria-label="Назад к контактам">${icon('back')}</button><strong>Blacklist (${persons.filter(p=>p.blocked).length})</strong></div><div class="item-list">${blocked.map(p=>`<button type="button" class="person-row" data-action="profile" data-id="${p.id}">${personHTML(p,p.name||'Заблокирован')}<span class="row-end">${icon('chevron')}</span></button>`).join('')||'<div class="empty-state">Список заблокированных пуст</div>'}</div>`;}
function teamDetail(){const t=team(currentTeam);if(!t){page='list';return listTeams()};const members=t.owner==='me'?[{id:'me',role:'owner',scope:'all',status:'accepted'},...t.members]:t.members;
return `<div class="team-detail"><div class="team-detail-title"><button type="button" class="back-link" data-action="team-back" aria-label="К списку команд">${icon('back')}</button><strong>Контакты и Команды</strong>${t.editable?`<button type="button" class="icon-more" data-action="team-edit" data-id="${t.id}" style="margin-left:auto" aria-label="Настройки команды" title="Настройки команды">${icon('gear')}</button>`:''}</div><section class="profile-hero"><div class="team-hero-copy"><h2>${esc(t.name)}</h2><p>${members.length} участников · ${t.editable?'Вы — владелец':'Участник'}</p>${t.description?`<p class="team-hero-description">${esc(t.description)}</p>`:''}</div></section><div class="section-head"><strong>Участники</strong><small>${members.length}</small></div><section class="form-section">${members.map(m=>m.id==='me'?`<div class="team-member"><span class="person-avatar avatar-moss">Вы</span><span class="person-text"><strong>Вы</strong><small>Владелец</small></span><button type="button" data-action="member-settings" data-id="me" aria-label="Действия участника: владелец">${icon('more')}</button></div>`:memberRow(m,`<button type="button" data-action="member-settings" data-id="${m.id}" aria-label="Действия участника">${icon('more')}</button>`)).join('')}</section>${t.editable?`<button type="button" class="create-team-button team-add-button" data-action="add-member">${icon('plus')} Добавить участника</button>`:''}<div class="section-head"><strong>Задания команды</strong><small>${t.assignments.length}</small></div>${t.assignments.length?t.assignments.map(a=>`<div class="assignment-row"><span class="assignment-icon">${icon('folder')}</span><div style="min-width:0;flex:1"><strong>${esc(a.name)}</strong><small>${esc(a.state)}</small></div>${icon('chevron')}</div>`).join(''):'<div class="empty-state">Нет связанных заданий</div>'}</div>`;}
function render(reset=true){updateHeader();renderDock();const box=$('#content');const y=$('#main').scrollTop;box.innerHTML=page==='team'?teamDetail():page==='blacklist'?listBlacklist():tab==='teams'?listTeams():listContacts();if(reset)$('#main').scrollTop=0;else $('#main').scrollTop=y;}
function setTab(value){tab=value;page='list';currentTeam='';directorySearch='';render();}
function openSheet(title,type,data=null){focusBack=document.activeElement;sheet=type;sheetData=data;$('#sheet-title').textContent=title;$('#overlay').hidden=false;$('#sheet-close').innerHTML=icon('close');drawSheet();$('#sheet-close').focus()}
function closeSheet(){sheet='';sheetData=null;$('#overlay').hidden=true;$('#sheet-body').innerHTML='';if(focusBack?.isConnected)focusBack.focus()}
function chooseTeamEdit(id){const t=team(id);if(!t||!t.editable)return;draft={id:t.id,name:t.name,description:t.description,members:structuredClone(t.members)};openSheet('Настройки команды','team-form')}
function drawSheet(){let html='';const t=team(currentTeam);switch(sheet){
case 'team-form': html=`<label class="sheet-label">Название команды<input type="text" name="team-name" maxlength="80" placeholder="Название" value="${esc(draft.name)}"></label><label class="sheet-label">Описание <span style="font-weight:400;color:#aaa">(необязательно)</span><textarea name="team-description" maxlength="1000" rows="3" placeholder="Для чего нужна команда">${esc(draft.description)}</textarea></label><div class="section-head"><strong>Участники</strong><small>${draft.members.length+(draft.id?1:1)}</small></div><div class="mini-list">${draft.members.map(m=>{const p=person(m.id);return p?`<button type="button" class="person-row" data-action="draft-member" data-id="${p.id}">${personHTML(p,roleLabel[m.role])}<span class="row-end">${icon('more')}</span></button>`:''}).join('')}</div>${button('pick-member',icon('plus')+' Добавить участника','ghost')}<p class="dialog-error" id="form-error" hidden></p>${button('team-save',draft.id?'Сохранить изменения':'Создать команду','primary')}`;break;
case 'team-menu':{const item=team(sheetData?.id);html=`${button('team-view',icon('users')+' Открыть команду')}${item?.editable?button('team-edit-menu',icon('edit')+' Изменить команду')+button('team-delete-question',icon('trash')+' Удалить команду','danger'):button('team-leave-question',icon('back')+' Выйти из команды','danger')}`;break;}
case 'team-confirm': html=`<p class="sheet-help">${sheetData?.mode==='delete'?'Команда будет удалена. Связанные задания не должны удаляться автоматически.':'Вы перестанете быть участником команды.'}</p>${button('team-confirm-yes',sheetData?.mode==='delete'?'Удалить команду':'Выйти из команды','danger')}${button('close-sheet','Отмена','ghost')}`;break;
case 'pick-member':{const available=persons.filter(p=>p.contact&&!p.blocked&&!draft.members.some(m=>m.id===p.id));html=`<p class="sheet-help">В команду можно добавлять пользователей из контактов.</p><div class="search-box" style="margin:0"><input type="search" id="member-search" placeholder="Поиск контактов" autocomplete="off" aria-label="Поиск контактов">${icon('search')}</div><div class="mini-list" id="picker-list">${available.map(p=>contactChoice(p)).join('')||'<p class="sheet-help">Все контакты уже в команде</p>'}</div>${button('add-contact-navigation','Перейти к контактам','ghost')}${button('back-to-team-form','Назад','ghost')}`;break;}
case 'member-form':{const own=sheetData?.id==='me'||sheetData?.id===team(currentTeam)?.owner;const p=person(sheetData?.id);const m=own?{id:sheetData?.id,role:'owner',scope:'all',status:'accepted'}:draft?.members.find(x=>x.id===p?.id);if(!m){closeSheet();return;}html=`<div class="profile-in-sheet">${own?(p?personHTML(p,'Владелец команды'):'<span class="person-avatar avatar-moss">Вы</span><div class="person-text"><strong>Вы</strong></div>'):personHTML(p,p?.name||'')}</div><label class="sheet-label">Роль<select name="member-role" ${own||(memberOrigin==='detail'&&!team(currentTeam)?.editable)?'disabled':''}><option value="owner" ${m.role==='owner'?'selected':''}>Владелец</option><option value="curator" ${m.role==='curator'?'selected':''}>Куратор</option><option value="contributor" ${m.role==='contributor'?'selected':''}>Исполнитель</option><option value="viewer" ${m.role==='viewer'?'selected':''}>Наблюдатель</option></select></label><label class="sheet-label">Доступ к файлам<select name="member-scope" ${own||(memberOrigin==='detail'&&!team(currentTeam)?.editable)?'disabled':''}><option value="default" ${m.scope==='default'?'selected':''}>По правилам задания</option><option value="none" ${m.scope==='none'?'selected':''}>Без доступа</option><option value="thumbnails" ${m.scope==='thumbnails'?'selected':''}>Только предпросмотр</option><option value="all" ${m.scope==='all'?'selected':''}>Полный доступ</option></select></label>${own?'<p class="sheet-help">Роль владельца нельзя изменить или удалить.</p>':memberOrigin==='detail'&&!team(currentTeam)?.editable?'<p class="sheet-help">Настройки участников может менять владелец команды.</p>':button('member-apply','Готово','primary')+button('member-remove',icon('trash')+' Удалить из команды','danger')}`;break;}
case 'profile':{const p=person(sheetData?.id);if(!p)return;html=`<div class="profile-in-sheet">${personHTML(p,p.name||'')}</div><p class="mutedline">${esc(p.username?'@'+p.username+' · ':'')}#${esc(p.uid)}</p>${p.blocked?button('unblock-profile',icon('lock')+' Разблокировать','primary'):p.contact?button('message-profile',icon('message')+' Написать')+button('remove-contact-question',icon('user')+' Удалить из контактов','danger')+button('block-contact-question',icon('lock')+' Заблокировать','danger'):button('add-contact-profile',icon('plus')+' Добавить в контакты','primary')+button('block-contact-question',icon('lock')+' Заблокировать','danger')}`;break;}
case 'profile-confirm': html=`<p class="sheet-help">${sheetData.mode==='block'?'Пользователь будет добавлен в список заблокированных.': 'Контакт будет удалён из вашего списка. Существующие команды автоматически не меняются.'}</p>${button('profile-confirm-yes',sheetData.mode==='block'?'Заблокировать':'Удалить контакт','danger')}${button('close-sheet','Отмена','ghost')}`;break;
case 'status': html=`<p class="sheet-help">В работе</p>${button('close-sheet','Закрыть','primary')}`;break;
case 'other': html=`<p class="sheet-help">Раздел «${esc(sheetData?.name)}» согласовывается отдельно.</p>${button('close-sheet','Закрыть','primary')}`;break;
}$('#sheet-body').innerHTML=html}
function contactChoice(p){return `<button type="button" class="person-row" data-action="pick-person" data-id="${p.id}">${personHTML(p,p.name||'Контакт')}<span class="row-end">${icon('plus')}</span></button>`}
function openTeam(id){currentTeam=id;page='team';render();}
function findContact(){const q=String($('#contact-query')?.value||'').trim();search=q;directorySearch=q;if(!q){directorySearch='';render(false);return};const found=persons.find(p=>('@'+p.username).toLowerCase()===q.toLowerCase() || p.uid===q.replace(/^#/,''));if(found&&found.contact){openSheet('Контакт','profile',{id:found.id});return}if(found&&!found.blocked){render(false);return}if(!found)toast('Пользователь не найден')}
function saveDraft(){const inp=$('[name="team-name"]'),descr=$('[name="team-description"]');if(inp)draft.name=inp.value.trim();if(descr)draft.description=descr.value.trim();if(!draft.name){const err=$('#form-error');if(err){err.textContent='Укажите название команды';err.hidden=false;}return}if(teams.some(t=>t.name.toLowerCase()===draft.name.toLowerCase()&&t.id!==draft.id)){const err=$('#form-error');if(err){err.textContent='Команда с таким названием уже существует';err.hidden=false;}return}if(draft.id){const t=team(draft.id);Object.assign(t,{name:draft.name,description:draft.description,members:structuredClone(draft.members)})}else{teams.unshift({id:'t'+teamCounter++,name:draft.name,description:draft.description,owner:'me',members:structuredClone(draft.members),assignments:[],editable:true});currentTeam=teams[0].id;page='team'}closeSheet();render();toast(draft.id?'Изменения сохранены':'Команда создана');draft=null;}
const clickHandler=e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;
switch(action){case 'status':openSheet('Состояние','status');break;
case 'header-blacklist':if(page==='blacklist'){page='list';tab='contacts';render();}else{page='blacklist';render();}break;
case 'blacklist-back':page='list';tab='contacts';render();break;
case 'create-team':startTeam();break;
case 'tab':setTab(b.dataset.tab);break;
case 'team-open':openTeam(id);break;
case 'team-back':page='list';render();break;
case 'team-menu':openSheet('Действия с командой','team-menu',{id});break;
case 'team-view':{const tid=sheetData.id;closeSheet();openTeam(tid);break;}
case 'team-edit-menu':{const tid=sheetData.id;closeSheet();openTeam(tid);chooseTeamEdit(tid);break;}
case 'team-edit':chooseTeamEdit(id);break;
case 'team-delete-question':sheet='team-confirm';sheetData={id:sheetData.id,mode:'delete'};$('#sheet-title').textContent='Удалить команду?';drawSheet();break;
case 'team-leave-question':sheet='team-confirm';sheetData={id:sheetData.id,mode:'leave'};$('#sheet-title').textContent='Выйти из команды?';drawSheet();break;
case 'team-confirm-yes':{const t=team(sheetData.id),mode=sheetData.mode;if(!t)return;if(mode==='delete')teams=teams.filter(x=>x.id!==t.id);else teams=teams.filter(x=>x.id!==t.id);closeSheet();page='list';render();toast(mode==='delete'?'Команда удалена':'Вы вышли из команды');break;}
case 'team-save':saveDraft();break;
case 'pick-member':{memberOrigin='form';const name=$('[name="team-name"]'),desc=$('[name="team-description"]');if(name)draft.name=name.value;if(desc)draft.description=desc.value;sheet='pick-member';$('#sheet-title').textContent='Добавить участника';drawSheet();break;}
case 'add-member':if(!team(currentTeam)?.editable)return;memberOrigin='detail';draft=structuredClone(team(currentTeam));openSheet('Добавить участника','pick-member');break;
case 'pick-person':if(!draft.members.some(m=>m.id===id))draft.members.push({id,role:'contributor',scope:'default',status:'invited'});sheet='member-form';sheetData={id};$('#sheet-title').textContent='Участник';drawSheet();break;
case 'draft-member':sheet='member-form';sheetData={id};$('#sheet-title').textContent='Участник';drawSheet();break;
case 'member-settings':{const t=team(currentTeam);if(!t)return;memberOrigin='detail';draft=structuredClone(t);openSheet('Участник','member-form',{id});break;}
case 'member-apply':{const member=draft?.members.find(m=>m.id===sheetData?.id);if(member){member.role=$('[name="member-role"]').value;member.scope=$('[name="member-scope"]').value;}if(memberOrigin==='detail'){const t=team(currentTeam);if(t?.editable){t.members=structuredClone(draft.members);closeSheet();render();toast('Участник обновлён');}}else{sheet='team-form';$('#sheet-title').textContent=draft.id?'Настройки команды':'Новая команда';drawSheet();}break;}
case 'member-remove':if(sheetData?.id==='me'||sheetData?.id===team(currentTeam)?.owner)break;draft.members=draft.members.filter(m=>m.id!==sheetData.id);if(memberOrigin==='detail'){const t=team(currentTeam);if(t?.editable){t.members=structuredClone(draft.members);closeSheet();render();toast('Участник удалён');}}else{sheet='team-form';$('#sheet-title').textContent=draft.id?'Настройки команды':'Новая команда';drawSheet();}break;
case 'back-to-team-form':sheet='team-form';$('#sheet-title').textContent=draft.id?'Настройки команды':'Новая команда';drawSheet();break;
case 'add-contact-navigation':closeSheet();setTab('contacts');$('#contact-query').focus();break;
case 'profile':openSheet('Профиль','profile',{id});break;
case 'add-contact':{const p=person(id);if(p&&!p.blocked){p.contact=true;directorySearch='';render();toast('Контакт добавлен')}break;}
case 'add-contact-profile':{const p=person(sheetData?.id);if(p){p.contact=true;closeSheet();render();toast('Контакт добавлен')}break;}
case 'unblock-profile':{const p=person(sheetData?.id);if(p){p.blocked=false;closeSheet();render();toast('Пользователь разблокирован')}break;}
case 'message-profile':closeSheet();toast('Переход в сообщения');break;
case 'remove-contact-question':sheet='profile-confirm';sheetData={...sheetData,mode:'remove'};$('#sheet-title').textContent='Удалить контакт?';drawSheet();break;
case 'block-contact-question':sheet='profile-confirm';sheetData={...sheetData,mode:'block'};$('#sheet-title').textContent='Заблокировать?';drawSheet();break;
case 'profile-confirm-yes':{const mode=sheetData.mode,p=person(sheetData.id);if(p){if(mode==='block'){p.blocked=true;p.contact=false}else p.contact=false;}closeSheet();render();toast(mode==='block'?'Пользователь заблокирован':'Контакт удалён');break;}
case 'dock':if(b.dataset.label==='Контакты'){page='list';tab='teams';render()}else openSheet(b.dataset.label,'other',{name:b.dataset.label});break;
case 'close-sheet':closeSheet();break;
}}
$('#app').addEventListener('click',clickHandler);
$('#app').addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();findContact()}});
$('#app').addEventListener('input',e=>{if(e.target.id==='contact-query'){search=e.target.value;const pos=e.target.selectionStart;const input=e.target;const pane=$('#contacts-list');const q=search.trim().toLowerCase().replace(/^[@#]/,'');const collection=persons.filter(p=>p.contact&&!p.blocked).filter(p=>[p.username,p.name,p.uid].some(s=>String(s).toLowerCase().includes(q)));if(pane)pane.innerHTML=contactListRows(collection);return;}if(e.target.id==='member-search'){const s=e.target.value.toLowerCase().replace(/^[@#]/,'');const collection=persons.filter(p=>p.contact&&!p.blocked&&!draft.members.some(m=>m.id===p.id)&&[p.username,p.name,p.uid].some(x=>String(x).toLowerCase().includes(s)));const target=$('#picker-list');if(target)target.innerHTML=collection.map(contactChoice).join('')||'<p class="sheet-help">Нет подходящих контактов</p>';}});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeSheet()});
document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-device]').forEach(v=>{v.classList.toggle('selected',v===b);v.setAttribute('aria-pressed',String(v===b))});$('#device').className='device '+b.dataset.device}));
render();
})();
</script>
</body>
</html>
