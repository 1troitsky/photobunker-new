function openSheet(title,markup){store.sheet=title;$('#sheet-title').textContent=title;$('#sheet-content').innerHTML=markup;$('#sheet-close').innerHTML=icon('close');$('#overlay').hidden=false;const focusable=$('#sheet-content button');if(focusable)focusable.focus({preventScroll:true})}
function showConfirm(title,message,button,action){openSheet(title,`<p class="intro">${message}</p><div class="choice-actions"><button type="button" class="action" data-action="close-sheet">Отмена</button><button type="button" class="action danger" data-action="${action}">${button}</button></div>`)}
function showExport(){const chosen=Object.entries(store.exportChoices).filter(([,v])=>v).map(([k])=>({files:'Мои файлы и описания',assignments:'Задания',settings:'Настройки приложения'}[k]));if(!chosen.length){toast('Выберите данные для экспорта');return}openSheet('Экспорт данных',`<p class="intro">Выбрано для переноса:</p><p>${chosen.map(esc).join('<br>')}</p><p>Для скачивания материалов приложение запросит подтверждение доступа и проверит права на каждый файл.</p><div class="choice-actions"><button class="action" data-action="close-sheet">Закрыть</button><button class="action primary" data-action="download-export-spec">${icon('download')} Сохранить список</button></div>`)}
async function saveSelection(){const lines=['PhotoBunker · Список для переноса',...Object.entries(store.exportChoices).filter(([,v])=>v).map(([k])=>({files:'Мои файлы и описания',assignments:'Задания',settings:'Настройки приложения'}[k]))];const content=lines.join('\n')+'\n';try{if(typeof window.showSaveFilePicker==='function'){const h=await window.showSaveFilePicker({suggestedName:'photobunker-export-selection.txt',types:[{description:'Текст',accept:{'text/plain':['.txt']}}]});const w=await h.createWritable();await w.write(content);await w.close();closeSheet();toast('Список сохранён');return}if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([content],'photobunker-export-selection.txt',{type:'text/plain'})]})){await navigator.share({files:[new File([content],'photobunker-export-selection.txt',{type:'text/plain'})],title:'PhotoBunker'});closeSheet();return}openSheet('Сохранение',`<p>На этом устройстве недоступен выбор места сохранения через браузер. Скопируйте список для переноса.</p><pre style="white-space:pre-wrap;font-size:11px">${esc(content)}</pre><button class="action" data-action="copy-export">${icon('download')} Скопировать список</button>`)}catch(e){if(e?.name!=='AbortError')toast('Не удалось сохранить список')}}
function navigate(route,target=null){if(!['data','settings','backup','queue','transfer','remove'].includes(route)){openSheet('Раздел PhotoBunker','<p>Этот раздел открывается из общего меню приложения.</p><button class="action" data-action="close-sheet">Закрыть</button>');return}store.scrollPositions[store.route]=$('#main').scrollTop;store.depth+=1;history.pushState({route,depth:store.depth},'',`#${route}`);store.route=route;store.searchOpen=false;store.query='';$('#search-tray').hidden=true;render();if(target)jumpTo(target)}
function jumpTo(id){const target=$('#setting-'+id)||$('#'+id);if(!target)return;const scroller=$('#main');const delta=target.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-12;scroller.scrollTop=Math.max(0,delta);target.classList.add('targeted');if(!target.hasAttribute('tabindex'))target.setAttribute('tabindex','-1');target.focus({preventScroll:true});setTimeout(()=>target.classList.remove('targeted'),1800)}
function render(keepScroll=false){const main=$('#main'),scroll=main.scrollTop;$('#content').innerHTML=store.searchOpen?renderSearch():({data:renderData,settings:renderSettings,backup:renderBackup,queue:renderQueue,transfer:renderTransfer,remove:renderRemove}[store.route]||renderData)();main.scrollTop=keepScroll?scroll:0;const save=$('#appearance-actions');save.hidden=!['data','backup'].includes(store.route)||store.searchOpen;$('#save-settings').disabled=!isDirty();$('#header-search').innerHTML=icon('search');$('#header-bell').innerHTML=icon('bell')+'<span class="bell-count">2</span>';renderDock()}
function renderDock(){const list=[['tasks','Задания'],['folder','Browser'],['camera','Камера'],['users','Контакты'],['user','Профиль']];$('#dock').innerHTML=list.map(([k,label])=>`<button type="button" data-action="dock" title="${label}" class="${k==='user'?'active':''}">${icon(k)}<small>${label}</small></button>`).join('')}
function searchToggle(open){store.searchOpen=open;store.query='';$('#search-tray').hidden=!open;$('#settings-query').value='';$('#search-icon').innerHTML=icon('search');$('#clear-search').innerHTML=icon('close');$('#clear-search').hidden=true;render();if(open)$('#settings-query').focus()}
function goBack(){if(store.searchOpen){searchToggle(false);return}if(store.sheet){closeSheet();return}if(store.depth>0&&history.state?.depth>0){history.back()}else if(store.route!=='settings')navigate('settings')}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.pref){store.draft[el.dataset.pref]=el.type==='range'?Number(el.value):(el.type==='checkbox'?el.checked:el.value);render(true)}if(el.dataset.export){store.exportChoices[el.dataset.export]=el.checked}});
document.addEventListener('input',e=>{if(e.target.id==='settings-query'){store.query=e.target.value;$('#clear-search').hidden=!store.query;render(true)}});
document.addEventListener('click',e=>{const device=e.target.closest('[data-device]');if(device){$('#device').className='device '+device.dataset.device;document.querySelectorAll('[data-device]').forEach(b=>{b.classList.toggle('selected',b===device);b.setAttribute('aria-pressed',String(b===device))});return}const res=e.target.closest('[data-target]');if(res){const route=res.dataset.route,target=res.dataset.target;searchToggle(false);navigate(route,target);return}const control=e.target.closest('[data-action]');if(!control)return;const action=control.dataset.action;e.preventDefault();switch(action){case 'search':searchToggle(!store.searchOpen);break;case 'close-search':searchToggle(false);break;case 'clear-search':store.query='';$('#settings-query').value='';$('#clear-search').hidden=true;render(true);$('#settings-query').focus();break;case 'back':goBack();break;case 'go-data':navigate('data');break;case 'go-backup':navigate('backup');break;case 'go-queue':navigate('queue');break;case 'select-backup':store.selectedBackup=control.dataset.backup;render(true);break;case 'toggle-backup-day':{const day=Number(control.dataset.day);const days=store.draft.autoBackupDays;store.draft.autoBackupDays=days.includes(day)?days.filter(d=>d!==day):[...days,day].slice(-PLAN.automaticBackupDays);render(true);break;}case 'go-transfer':navigate('transfer');break;case 'go-remove':navigate('remove');break;case 'open-security':case 'open-other-security':case 'open-other-appearance':case 'open-other-notifications':case 'open-other-help':case 'open-other-profile':case 'bell':case 'dock':case 'tariff':case 'status':navigate('other');break;case 'save':store.saved=clonePreferences(store.draft);render(true);toast('Настройки сохранены');break;case 'cancel':store.draft=clonePreferences(store.saved);render(true);toast('Изменения отменены');break;case 'close-sheet':closeSheet();break;case 'remove-queued-file':{const f=store.queueFiles.find(f=>f.id===control.dataset.file);if(!f)break;openSheet('Удалить файл из очереди?',`<p class="intro">${esc(f.name)} · ${f.mb} МБ</p><p>Файл ещё не синхронизирован с облаком. Его удаление из очереди также удалит защищённую локальную копию. Восстановление может быть невозможно.</p><div class="choice-actions"><button class="action" data-action="close-sheet">Отмена</button><button class="action danger" data-action="confirm-remove-queued-file" data-file="${f.id}">Удалить файл</button></div>`);break;}case 'confirm-remove-queued-file':store.queueFiles=store.queueFiles.filter(f=>f.id!==control.dataset.file);closeSheet();render(true);toast('Файл удалён из очереди');break;case 'clear-cache':showConfirm('Очистить кэш?','Удаляются только временные зашифрованные файлы и миниатюры. Очистка не затрагивает очередь отправки, ключи и локальные оригиналы, ещё не синхронизированные с сервером.','Очистить кэш','confirm-clear-cache');break;case 'confirm-clear-cache':store.cacheMb=0;closeSheet();render(true);toast('Кэш очищен');break;case 'create-backup':{if(remainingManual()===0||MAX_BACKUP_COPIES===0)break;const displaced=store.backups.length>=MAX_BACKUP_COPIES;openSheet('Создать резервную копию?',`<p class="intro">Новая резервная копия будет зашифрована и проверена.</p><p>${displaced?'После успешного создания и проверки новой копии самая старая из текущих может быть заменена.':'Текущие материалы будут включены в резервную копию в пределах доступных прав и сроков.'}</p><div class="choice-actions"><button type="button" class="action" data-action="close-sheet">Отмена</button><button type="button" class="action primary" data-action="confirm-create-backup">Создать</button></div>`);break;}case 'confirm-create-backup':{if(remainingManual()===0||MAX_BACKUP_COPIES===0)break;store.manualBackupUsed++;const createdAt=new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date());const b={id:'backup-'+store.manualBackupUsed,createdAt,sizeGb:8.5,files:store.cloudFiles,origin:'Ручная',status:'Проверена'};store.backups=[b,...store.backups].slice(0,MAX_BACKUP_COPIES);store.selectedBackup=b.id;closeSheet();render(true);toast('Резервная копия создана');break;}case 'delete-backup':{const b=backupById(control.dataset.backup);if(!b)break;openSheet('Удалить резервную копию?',`<p class="intro">${esc(b.createdAt)} · ${formatBackupSize(b)} · ${fmtCount(b.files)} файлов</p><p>Удаление этой копии может лишить вас возможности восстановить сохранённые данные. Отменить удаление нельзя.</p><div class="choice-actions"><button class="action" data-action="close-sheet">Отмена</button><button class="action danger" data-action="confirm-delete-backup" data-backup="${esc(b.id)}">Удалить копию</button></div>`);break;}case 'confirm-delete-backup':{const id=control.dataset.backup;store.backups=store.backups.filter(b=>b.id!==id);if(store.selectedBackup===id)store.selectedBackup=store.backups[0]?.id||null;closeSheet();render(true);toast('Резервная копия удалена');break;}case 'check-backup':{const b=backupById(store.selectedBackup);if(b)b.status='Проверена';render(true);toast('Проверка завершена');break;}case 'restore-backup':{const b=backupById(control.dataset.backup);if(!b)break;store.selectedBackup=b.id;openSheet('Восстановление данных',`<p class="intro">Копия от ${esc(b.createdAt)} · ${formatBackupSize(b)} · ${fmtCount(b.files)} файлов. Для восстановления потребуется Recovery Key.</p><p>Восстановить можно только доступные материалы, срок хранения которых ещё не истёк.</p><p>Перед началом необходимо проверить текущие файлы устройства и выбрать способ объединения данных.</p><div class="choice-actions"><button class="action" data-action="close-sheet">Отмена</button><button class="action primary" data-action="review-restore">Продолжить</button></div>`);break;}case 'review-restore':openSheet('Способ восстановления',`<p>Выберите, как поступить с текущими локальными материалами.</p><label class="field-label" for="restore-method">Способ</label><select class="form-select" id="restore-method"><option value="merge">Объединить с текущими</option><option value="separate">Восстановить отдельно</option></select><div class="choice-actions"><button class="action" data-action="close-sheet">Отмена</button><button class="action primary" data-action="finish-restore">Далее</button></div>`);break;case 'finish-restore':closeSheet();toast('Выбран способ восстановления');break;case 'prepare-export':showExport();break;case 'download-export-spec':void saveSelection();break;case 'copy-export':{const text='PhotoBunker · Выбранные данные для переноса\n'+Object.keys(store.exportChoices).filter(k=>store.exportChoices[k]).join(', ');void navigator.clipboard?.writeText(text).then(()=>toast('Список скопирован')).catch(()=>toast('Не удалось скопировать'));closeSheet();break}case 'remove-device':showConfirm('Удаление данных с устройства','Будут удалены локальные материалы и ключи доступа. Неотправленные в облако файлы могут быть потеряны.','Удалить с устройства','confirm-remove-device');break;case 'confirm-remove-device':closeSheet();toast('Удаление требует подтверждения на устройстве');break;case 'remove-cloud':showConfirm('Удаление облачных данных','После подтверждения сервер должен удалить доступные облачные материалы. Эта операция не заменяет экстренный PIN и не отменяет правила резервных копий.','Удалить из облака','confirm-remove-cloud');break;case 'confirm-remove-cloud':closeSheet();toast('Требуется подтверждение сервера');break;}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(store.sheet)closeSheet();else if(store.searchOpen)searchToggle(false)}});
window.addEventListener('popstate',e=>{store.route=['data','settings','backup','queue','transfer','remove'].includes(e.state?.route)?e.state.route:'data';store.depth=e.state?.depth||0;store.searchOpen=false;$('#search-tray').hidden=true;render();$('#main').scrollTop=store.scrollPositions[store.route]||0});
const hash=decodeURIComponent(location.hash.slice(1));store.route=['data','settings','backup','queue','transfer','remove'].includes(hash)?hash:'data';history.replaceState({route:store.route,depth:0},'',`#${store.route}`);$('#search-icon').innerHTML=icon('search');$('#clear-search').innerHTML=icon('close');render();
})();

</script></body></html>
