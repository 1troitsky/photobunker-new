 ...definitions.map(d=>({id:d.id,name:d.label,group:d.g,terms:d.keys.toLowerCase()+' '+d.label.toLowerCase()})),
 {id:'systemPush',name:'Системные push',group:'Уведомления',terms:'push пуш разрешение notification permission ios android ios pwa'},
 {id:'badge',name:'Счётчик на иконке',group:'Уведомления',terms:'badge badges иконка счетчик значок'},
 {id:'quiet',name:'Тихие часы',group:'Уведомления',terms:'quiet hours silent не беспокоить расписание'},
 {id:'privacy',name:'Приватность push',group:'Уведомления',terms:'privacy скрыть детали приватность уведомления lock screen'}
];
function searchResults(){const q=state.query.trim().toLowerCase();if(!q)return `<div class="page-wrap"><div class="page-heading"><h1>Поиск по настройкам</h1></div><p class="explanation">Можно искать: push, задания, backup, тихие часы, privacy.</p></div>`;const matched=indexSearch.filter(o=>(o.name+' '+o.group+' '+o.terms).toLowerCase().includes(q));return `<div class="page-wrap"><div class="page-heading"><h1>Результаты поиска</h1></div><div class="panel">${matched.length?matched.map(x=>`<button type="button" class="search-row" data-action="goto" data-target="${x.id}">${icon('search')}<span class="copy"><strong>${esc(x.name)}</strong><small>${esc(x.group)} · открывает конкретную настройку</small></span>${icon('chevron')}</button>`).join(''):`<div class="empty">Ничего не найдено</div>`}</div></div>`}
function renderSettings(){return `<div class="page-wrap"><div class="page-heading"><h1>Настройки</h1></div><div class="menu-group"><h2 class="menu-title">Приложение</h2><div class="panel">${line('bell','Уведомления','Входящие события и напоминания','go-inbox')+line('info','Настройки уведомлений','Push, категории, тихие часы','notifications')}${line('info','Оформление','Тема, цвет, размер текста, язык','other')}${line('shield','Безопасность и приватность','PIN, устройства и ключи','other')}</div></div><div class="menu-group"><h2 class="menu-title">Остальные разделы</h2><div class="panel">${line('user','Профиль и люди','Профиль, контакты, команды','other')}${line('database','Данные и хранилище','Облако, бэкапы, кэш','other')}</div></div></div>`}
function renderDock(){const vals=[['tasks','Задания'],['folder','Browser'],['camera','Камера'],['users','Контакты'],['user','Профиль']];$('#dock').innerHTML=vals.map(([k,n])=>`<button type="button" class="${n==='Профиль'?'active':''}" data-action="dock">${icon(k)}<small>${n}</small></button>`).join('');}
function renderMain(){const main=$('#main'),content=$('#content'),isInbox=!state.searchOpen&&state.route==='inbox';main.classList.toggle('inbox-mode',isInbox);content.classList.toggle('inbox-content',isInbox);content.innerHTML=state.searchOpen?searchResults():state.route==='settings'?renderSettings():state.route==='notifications'?renderNotifications():state.route==='inbox'?inbox():objectPage(state.objectId);main.scrollTop=0;$('#appearance-actions').hidden=state.searchOpen||state.route!=='notifications';$('#save-btn').disabled=!dirty();refreshBell();$('#header-search').hidden=!['settings','notifications'].includes(state.route);$('#header-mark-all').hidden=!isInbox;$('#header-mark-all').disabled=unreadCount()===0;$('#header-notify-settings').hidden=!isInbox;$('.header-actions .plan-pill').hidden=isInbox;}
function go(route,objectId=null){if(route==='inbox'){notificationView.openId=null;notificationView.openObjectId=null;}state.searchOpen=false;$('#search-tray').hidden=true;state.query='';$('#settings-query').value='';$('#header-search').setAttribute('aria-expanded','false');if(state.route!==route||(route==='object'&&state.objectId!==objectId)){const hash=route==='object'?`object-${objectId}`:route;history.pushState({route,objectId},'',`#${hash}`);state.route=route;state.objectId=objectId}renderMain();}
function openSearch(){state.searchOpen=!state.searchOpen;state.query='';$('#search-tray').hidden=!state.searchOpen;$('#settings-query').value='';$('#header-search').setAttribute('aria-expanded',String(state.searchOpen));renderMain();if(state.searchOpen)$('#settings-query').focus();}
function goField(id){state.searchOpen=false;$('#search-tray').hidden=true;$('#settings-query').value='';state.query='';if(state.route!=='notifications'){history.pushState({route:'notifications'},'','#notifications');state.route='notifications'}renderMain();const el=document.getElementById('setting-field-'+id);if(!el)return;const main=$('#main');const top=el.getBoundingClientRect().top-main.getBoundingClientRect().top+main.scrollTop-13;main.scrollTop=Math.max(0,top);el.focus({preventScroll:true});el.classList.add('targeted');setTimeout(()=>el.classList.remove('targeted'),1700)}
function openSheet(title,html){$('#sheet-title').textContent=title;$('#sheet-content').innerHTML=html;$('#overlay').hidden=false;$('#sheet-close').focus()}
function closeSheet(){$('#overlay').hidden=true}
function capabilitySheet(){const d=detect();const items=[['HTTPS/secure context',d.secure],['Service Worker API',d.sw],['Push API',d.push],['Notifications API',d.notif],['Badging API',d.badge],['Запущено как установленное PWA',d.standalone]];openSheet('Поддержка на этом устройстве',`<div class="sheet-text">${items.map(([k,v])=>`<p>${v?'✓':'—'} ${k}: <b>${v?'обнаружено':'нет / недоступно'}</b></p>`).join('')}<p>Разрешение ОС: <b>${esc(d.perm)}</b>. Эта проверка не доказывает, что сервер PhotoBunker настроил push, и не отправляет тестовые события.</p></div>`)}
function howPush(){openSheet('Как включить системные push',`<div class="sheet-text"><p><b>iPhone / iPad:</b> iOS 16.4+ — установить PhotoBunker на экран «Домой», открыть установленное приложение и нажать «Включить push» в production. Разрешить уведомления в системном запросе.</p><p><b>Android:</b> разрешить уведомления для сайта/установленной PWA в браузере и в настройках устройства.</p><p><b>Компьютер:</b> разрешить уведомления сайту в браузере или системной панели.</p><p><b>Важно:</b> для системных push необходима настроенная отправка с сервера. Разрешение запрашивается только по действию пользователя.</p><p>Подробнее: <a target="_blank" rel="noopener noreferrer" href="https://webkit.org/blog/13878/web-push-for-web-apps-on-ios-and-ipados/">WebKit об iOS Web Push</a> и <a target="_blank" rel="noopener noreferrer" href="https://developer.mozilla.org/en-US/docs/Web/API/Push_API">MDN о Push API</a>.</p></div>`)}
function setValue(k,v){state.draft[k]=v;renderMainKeep();}
function renderMainKeep(){const m=$('#main'),y=m.scrollTop;renderMain();m.scrollTop=y;}
function onClick(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='go-inbox'){go('inbox');return;}
 if(a==='filter-notifications'){notificationView.filter=el.dataset.filter==='unread'?'unread':'all';notificationView.openId=null;notificationView.openObjectId=null;history.replaceState({route:'inbox',openId:null},'','#inbox');renderMain();return;}
 if(a==='mark-all-notifications'){sampleNotifications.forEach(n=>n.unread=false);renderMain();return;}
 if(a==='open-notification'){const n=sampleNotifications.find(x=>x.id===el.dataset.id);if(n){n.unread=false;notificationView.openId=n.id;notificationView.openObjectId=null;history.pushState({route:'inbox',openId:n.id},'',`#inbox/${n.id}`);renderMain();}return;}
 if(a==='collapse-notification'){if(history.state?.openId&&history.length>1){history.back();}else{notificationView.openId=null;notificationView.openObjectId=null;history.replaceState({route:'inbox',openId:null},'','#inbox');renderMain();}return;}
 if(a==='open-object'){if(state.route==='inbox'&&notificationView.openId){notificationView.openObjectId=el.dataset.object;renderMain();}else go('object',el.dataset.object);return;}
 if(a==='team-decision'){objectState.teamDecision=el.dataset.decision;renderMain();return;}
 if(a==='notification-preferences'){go('notifications');return;}
 if(a==='back'){if(state.route==='inbox'&&notificationView.openId){if(history.state?.openId&&history.length>1){history.back();}else{notificationView.openId=null;notificationView.openObjectId=null;history.replaceState({route:'inbox',openId:null},'','#inbox');renderMain();}}else{history.state?.route && history.length>1?history.back():go('settings');}return;}
 if(a==='notifications'){go('notifications');return;}
 if(a==='other'){toast('Раздел находится в другом макете');return;}
 if(a==='search'){openSearch();return;}if(a==='close-search'){openSearch();return;}
 if(a==='clear-search'){$('#settings-query').value='';state.query='';renderMain();$('#settings-query').focus();return;}
 if(a==='goto'){goField(el.dataset.target);return;}
 if(a==='inspect'){capabilitySheet();return;}if(a==='howpush'){howPush();return;}
 if(a==='save'){state.saved={...state.draft};renderMainKeep();toast('Настройки сохранены');return;}
 if(a==='cancel'){state.draft={...state.saved};renderMainKeep();toast('Изменения отменены');return;}
 if(a==='close-sheet'){closeSheet();return;}
 if(a==='tariff'){openSheet('Текущий тариф',`<div class="sheet-text"><p>Unlimited (267 дней)</p></div>`);return;}
 if(a==='status'){openSheet('Состояние',`<div class="sheet-text"><p>Все операции обработаны.</p></div>`);return;}
 if(a==='dock'){toast('Разделы Dock находятся в других экранах');return;}
}
document.addEventListener('click',onClick);
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-pref]'))return;state.draft[el.dataset.pref]=el.type==='checkbox'?el.checked:el.value;renderMainKeep();});
$('#settings-query').addEventListener('input',e=>{state.query=e.target.value;$('#clear-search').hidden=!state.query;const m=$('#main');$('#content').innerHTML=searchResults();m.scrollTop=0;});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden)closeSheet();else if(state.searchOpen)openSearch()}});
window.addEventListener('popstate',e=>{state.route=['settings','notifications','inbox','object'].includes(e.state?.route)?e.state.route:'settings';state.objectId=e.state?.objectId||null;notificationView.openId=e.state?.openId||null;notificationView.openObjectId=null;state.searchOpen=false;$('#search-tray').hidden=true;renderMain();});
document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{const device=$('#device');device.className='device '+b.dataset.device;document.querySelectorAll('[data-device]').forEach(v=>{v.classList.toggle('selected',v===b);v.setAttribute('aria-pressed',String(v===b))})}));
$('#header-search').innerHTML=icon('search');$('#header-mark-all').innerHTML=icon('checkall');$('#header-notify-settings').innerHTML=icon('settings');$('#header-notifications .header-bell-icon').innerHTML=icon('bell');$('#search-icon').innerHTML=icon('search');$('#clear-search').innerHTML=icon('close');$('#sheet-close').innerHTML=icon('close');
const fragment=decodeURIComponent(location.hash.slice(1));state.route=fragment==='settings'?'settings':(fragment==='inbox'||fragment.startsWith('inbox/'))?'inbox':fragment.startsWith('object-')?'object':'notifications';state.objectId=fragment.startsWith('object-')?fragment.slice(7):null;notificationView.openId=fragment.startsWith('inbox/')?fragment.slice(6):null;history.replaceState({route:state.route,objectId:state.objectId,openId:notificationView.openId},'',`#${fragment||'notifications'}`);
renderDock();renderMain();
})();
</script></body></html>
