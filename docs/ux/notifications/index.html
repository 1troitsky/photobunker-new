<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Уведомления · Fieldwork 1.4 · PhotoBunker</title><link rel="stylesheet" href="style.css"></head><body>
<div class="preview-bar"><span class="preview-label"><i></i>FIELDWORK / NOTIFICATIONS 1.5 <small>· интерактивный экран</small></span><div class="preview-modes"><button class="selected" type="button" data-device="phone" aria-pressed="true">Телефон</button><button type="button" data-device="desktop" aria-pressed="false">Desktop</button></div></div>
<div class="preview-stage"><div class="device phone" id="device"><div class="app" id="app">
<header class="app-header"><span class="brand-mark">pb</span><button class="brand-state" type="button" data-action="status"><strong>PhotoBunker</strong><small><i class="state-led"></i>В работе</small></button><div class="header-actions"><button class="plan-pill" type="button" data-action="tariff">Unlimited (267 дней)</button><button id="header-search" type="button" data-action="search" aria-label="Поиск по настройкам" aria-expanded="false"></button><button id="header-mark-all" type="button" data-action="mark-all-notifications" aria-label="Прочитать все" title="Прочитать все" hidden></button><button id="header-notify-settings" type="button" data-action="notification-preferences" aria-label="Настройки уведомлений" title="Настройки уведомлений" hidden></button><button id="header-notifications" type="button" data-action="go-inbox" aria-label="Уведомления" title="Уведомления"><span class="header-bell-icon"></span><span id="notification-count" class="notification-count" aria-label="Непрочитанные уведомления" hidden></span></button></div></header>
<div class="search-tray" id="search-tray" hidden><div class="search-input-wrap"><span id="search-icon"></span><input type="search" id="settings-query" autocomplete="off" placeholder="Поиск по настройкам" aria-label="Поиск по настройкам"><button class="clear-button" data-action="clear-search" id="clear-search" type="button" aria-label="Очистить поиск" hidden></button></div><button class="close-search" data-action="close-search" type="button">Отмена</button></div>

<main class="app-main" id="main"><div class="content" id="content"></div></main>
<div class="appearance-actions-fixed" id="appearance-actions" aria-label="Сохранение настроек"><div class="appearance-actions-inner"><button class="action-button" type="button" id="cancel-btn" data-action="cancel">Отмена</button><button class="action-button save" type="button" id="save-btn" data-action="save" disabled>Сохранить</button></div></div>
<nav class="app-dock" id="dock" aria-label="Главная навигация"></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><strong id="sheet-title"></strong><button id="sheet-close" type="button" data-action="close-sheet" aria-label="Закрыть"></button></div><div id="sheet-content"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
</div></div></div>
<script src="app.js"></script></body></html>
